<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Deadline Notes</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- Font Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: {
                        bgApp: '#F8FAFC',
                        surface: '#FFFFFF',
                        borderLight: '#E2E8F0',
                        textMain: '#0F172A',
                        textMuted: '#64748B'
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #F8FAFC;
            color: #0F172A;
            -webkit-font-smoothing: antialiased;
        }
        /* Custom Scrollbar */
        textarea::-webkit-scrollbar { width: 6px; }
        textarea::-webkit-scrollbar-track { background: #F1F5F9; border-radius: 10px; }
        textarea::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 10px; }
        textarea::-webkit-scrollbar-thumb:hover { background: #94A3B8; }
        
        .btn-loading { opacity: 0.7; pointer-events: none; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes modalPop { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .animate-modal { animation: modalPop 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    </style>
</head>
<body class="pb-24" onload="initApp()">

    <!-- HEADER -->
    <header class="bg-surface/90 backdrop-blur-md border-b border-borderLight sticky top-0 z-40 shadow-sm">
        <div class="max-w-3xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-sm font-extrabold text-textMain uppercase tracking-widest flex items-center gap-2">
                <i class="ph-fill ph-push-pin text-blue-600 text-xl"></i> DEADLINE <span class="text-blue-600">NOTES</span>
            </h1>
            <span id="syncIndicator" class="text-[10px] font-bold text-slate-400 bg-slate-50 px-3 py-1.5 rounded-xl border border-slate-200 flex items-center gap-1.5 shadow-sm">
                <i class="ph-bold ph-arrows-clockwise text-blue-500"></i> Ready
            </span>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="max-w-3xl mx-auto p-4 space-y-6 mt-4">
        
        <!-- INPUT SECTION -->
        <div class="bg-white p-5 rounded-[24px] shadow-sm border border-slate-200 animate-fade">
            <form id="formDeadline" onsubmit="addDeadline(event)" class="space-y-4">
                <div class="relative">
                    <textarea id="noteInput" rows="4" placeholder="Tulis deadline atau catatan baru di sini..." required class="w-full bg-slate-50 border border-slate-200 rounded-xl p-4 text-[13px] md:text-[14px] font-medium text-slate-800 outline-none focus:border-blue-400 focus:ring-2 focus:ring-blue-100 transition-all resize-none"></textarea>
                </div>
                <div class="flex justify-end">
                    <button type="submit" id="btnSubmitAdd" class="bg-blue-600 text-white px-6 py-3 rounded-xl font-extrabold text-[12px] uppercase tracking-widest hover:bg-blue-700 active:scale-[0.98] transition-all flex items-center gap-2 shadow-md shadow-blue-500/20">
                        <i class="ph-bold ph-plus text-[14px]"></i> Tambah Deadline
                    </button>
                </div>
            </form>
        </div>

        <!-- TABS -->
        <div class="flex gap-2 p-1 bg-slate-200/50 rounded-2xl w-fit mx-auto md:mx-0 animate-fade" style="animation-delay: 0.1s;">
            <button onclick="switchTab('active')" id="tab-active" class="px-6 py-2.5 rounded-xl text-[12px] font-extrabold uppercase tracking-wider transition-all bg-white text-blue-600 shadow-sm">Aktif</button>
            <button onclick="switchTab('archived')" id="tab-archived" class="px-6 py-2.5 rounded-xl text-[12px] font-extrabold uppercase tracking-wider transition-all text-slate-500 hover:text-slate-700">Diarsipkan</button>
        </div>

        <!-- LIST CONTAINER -->
        <div id="notesContainer" class="space-y-4 animate-fade" style="animation-delay: 0.2s;">
            <!-- Render dari Javascript -->
        </div>
    </main>

    <!-- MODAL EDIT FULL SCREEN -->
    <div id="editModal" class="hidden fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm items-center justify-center p-4 md:p-8">
        <div class="bg-white w-full max-w-4xl h-[85vh] rounded-[24px] shadow-2xl flex flex-col overflow-hidden animate-modal border border-slate-200">
            <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                <h2 class="text-[13px] md:text-[14px] font-extrabold text-slate-800 uppercase tracking-widest flex items-center gap-2">
                    <i class="ph-fill ph-pencil-simple text-amber-500 text-xl"></i> Mode Edit Layar Penuh
                </h2>
                <button type="button" onclick="cancelEdit()" class="text-slate-400 hover:text-rose-500 hover:bg-rose-50 p-2 rounded-xl transition-colors">
                    <i class="ph-bold ph-x text-xl"></i>
                </button>
            </div>
            <div class="flex-1 p-4 bg-slate-100/50">
                <textarea id="editNoteInput" class="w-full h-full bg-white border border-slate-200 rounded-xl p-5 text-[14px] font-medium text-slate-800 outline-none focus:border-amber-400 focus:ring-2 focus:ring-amber-100 transition-all resize-none shadow-inner leading-relaxed" placeholder="Edit catatanmu di sini..."></textarea>
            </div>
            <div class="px-6 py-4 border-t border-slate-100 flex flex-col-reverse sm:flex-row justify-end gap-3 bg-white">
                <button type="button" onclick="cancelEdit()" class="bg-slate-100 text-slate-600 px-8 py-3.5 rounded-xl font-extrabold text-[12px] uppercase tracking-widest hover:bg-slate-200 transition-all text-center">Batal</button>
                <button type="button" id="btnSaveEdit" onclick="saveEdit(event)" class="bg-amber-500 text-white px-8 py-3.5 rounded-xl font-extrabold text-[12px] uppercase tracking-widest hover:bg-amber-600 active:scale-[0.98] transition-all flex items-center justify-center gap-2 shadow-md shadow-amber-500/20">
                    <i class="ph-bold ph-check-circle text-[16px]"></i> Simpan Perubahan
                </button>
            </div>
        </div>
    </div>

    <script>
        // Mencegah Inspect Element
        document.addEventListener('keydown', function(e) { if (e.ctrlKey && ['c','u','s','p','a'].includes(e.key.toLowerCase())) e.preventDefault(); });

        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxowuOA-SAq4m4a5sGRljiP8vp7yPkO5QunSGH8WBOJyKiQyGbp_FyY7A6pNGfY6y0rBg/exec";
        const SPREADSHEET_ID = '1d3njy330ifMnm-uBD8daaey5AqYO3rQxaI-tLZQdeyI';
        const SHEET_NAME = 'deadline';

        let globalNotes = [];
        let currentTab = 'active';
        let editingId = null;

        function escapeHTML(str) {
            return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }

        async function initApp() { await loadDataFast(); }

        function setSyncStatus(status) {
            const ind = document.getElementById('syncIndicator');
            if(status === 'loading') ind.innerHTML = '<i class="ph-bold ph-arrows-clockwise animate-spin text-blue-500"></i> Syncing...';
            else if(status === 'done') ind.innerHTML = '<i class="ph-bold ph-check text-emerald-500"></i> Updated';
            else if(status === 'error') ind.innerHTML = '<i class="ph-bold ph-warning text-rose-500"></i> Error';
            
            if(status === 'done' || status === 'error') setTimeout(() => { ind.innerHTML = '<i class="ph-bold ph-check-circle text-emerald-500"></i> Ready'; }, 2000);
        }

        async function loadDataFast() {
            setSyncStatus('loading');
            const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json&sheet=${SHEET_NAME}&t=${Date.now()}`;
            
            try {
                const response = await fetch(url, { cache: "no-store" });
                const text = await response.text();
                const jsonStr = text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1);
                const data = JSON.parse(jsonStr);
                
                const cols = data.table.cols.map(c => c ? c.label : '').map(l => l.trim().toLowerCase());
                globalNotes = data.table.rows.map(r => {
                    let row = {};
                    r.c.forEach((c, i) => { 
                        if(cols[i]) {
                            row[cols[i]] = c ? String(c.v) : ''; 
                        }
                    });
                    return row;
                });
                
                renderNotes();
                setSyncStatus('done');
            } catch(e) {
                console.error(e);
                setSyncStatus('error');
            }
        }

        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('tab-active').className = tab === 'active' ? 'px-6 py-2.5 rounded-xl text-[12px] font-extrabold uppercase tracking-wider transition-all bg-white text-blue-600 shadow-sm' : 'px-6 py-2.5 rounded-xl text-[12px] font-extrabold uppercase tracking-wider transition-all text-slate-500 hover:text-slate-700';
            document.getElementById('tab-archived').className = tab === 'archived' ? 'px-6 py-2.5 rounded-xl text-[12px] font-extrabold uppercase tracking-wider transition-all bg-white text-blue-600 shadow-sm' : 'px-6 py-2.5 rounded-xl text-[12px] font-extrabold uppercase tracking-wider transition-all text-slate-500 hover:text-slate-700';
            renderNotes();
        }

        function renderNotes() {
            const container = document.getElementById('notesContainer');
            container.innerHTML = '';
            
            const filteredNotes = globalNotes.filter(n => n.status === currentTab && n.id);
            
            if(filteredNotes.length === 0) {
                container.innerHTML = `<div class="p-10 border-2 border-dashed border-slate-200 rounded-[24px] text-center bg-white shadow-sm flex flex-col items-center">
                        <i class="ph-fill ${currentTab === 'active' ? 'ph-note-blank' : 'ph-archive'} text-4xl text-slate-300 mb-3"></i>
                        <p class="text-[13px] font-bold text-slate-400 mt-2">Belum ada catatan di sini.</p>
                    </div>`;
                return;
            }

            [...filteredNotes].reverse().forEach(item => {
                const isArchived = item.status === 'archived';
                const formattedText = escapeHTML(item.note).replace(/\n/g, '<br>');
                
                const card = `
                <div class="bg-white p-5 rounded-[20px] border border-slate-200 shadow-sm hover:shadow-md hover:border-blue-200 transition-all group">
                    <p class="text-[13px] md:text-[14px] text-slate-700 font-medium leading-relaxed mb-4">${formattedText}</p>
                    <div class="flex flex-wrap justify-between items-center pt-3 border-t border-slate-100 gap-3">
                        <span class="text-[10px] font-bold text-slate-400 flex items-center gap-1"><i class="ph-bold ph-calendar-blank"></i> ${item.timestamp || 'Baru saja'}</span>
                        <div class="flex gap-2">
                            ${!isArchived ? `<button onclick="triggerEdit('${item.id}')" class="text-[11px] font-extrabold uppercase tracking-widest bg-amber-50 text-amber-600 hover:bg-amber-500 hover:text-white border border-amber-100 px-3 py-2 rounded-xl transition-colors flex items-center justify-center">
                                <i class="ph-bold ph-pencil-simple text-[14px]"></i> Edit
                            </button>` : ''}
                            <button onclick="updateStatus('${item.id}', '${isArchived ? 'active' : 'archived'}', this)" class="text-[11px] font-extrabold uppercase tracking-widest ${isArchived ? 'bg-emerald-50 text-emerald-600 hover:bg-emerald-100 border-emerald-100' : 'bg-slate-50 text-slate-600 hover:bg-slate-100 border-slate-200'} border px-4 py-2 rounded-xl transition-colors flex items-center gap-1.5">
                                <i class="ph-bold ${isArchived ? 'ph-arrow-u-up-left' : 'ph-archive'} text-[14px]"></i> ${isArchived ? 'Kembalikan' : 'Arsipkan'}
                            </button>
                            <button onclick="deleteNote('${item.id}', this)" class="text-[11px] font-extrabold uppercase tracking-widest bg-rose-50 text-rose-500 hover:bg-rose-500 hover:text-white border border-rose-100 px-3 py-2 rounded-xl transition-colors flex items-center justify-center">
                                <i class="ph-bold ph-trash text-[14px]"></i>
                            </button>
                        </div>
                    </div>
                </div>`;
                container.innerHTML += card;
            });
        }

        // ==========================================
        // PERBAIKAN 1: DB CALL SEKARANG MENANGKAP ERROR DARI APPS SCRIPT
        // ==========================================
        async function dbCall(payload) {
            try {
                const res = await fetch(SCRIPT_URL, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) });
                const text = await res.text();
                try {
                    return JSON.parse(text);
                } catch (err) {
                    console.error("Gagal memproses JSON. Respons dari Google:", text);
                    return { status: 'error' };
                }
            } catch (error) { 
                console.error("Koneksi gagal:", error);
                return { status: 'error' }; 
            }
        }

        async function addDeadline(e) {
            e.preventDefault();
            const noteVal = document.getElementById('noteInput').value.trim();
            if(!noteVal) return;

            const btn = document.getElementById('btnSubmitAdd');
            const origHtml = btn.innerHTML;
            btn.innerHTML = '<i class="ph-bold ph-spinner animate-spin text-[14px]"></i> MENYIMPAN...'; 
            btn.classList.add('btn-loading');

            const now = new Date();
            const dateStr = now.toLocaleDateString('id-ID') + ' ' + now.toLocaleTimeString('id-ID', {hour: '2-digit', minute:'2-digit'});
            
            // PERBAIKAN 2: Tambahkan awalan "NOTE-" agar Sheets tidak merubahnya menjadi format Angka secara otomatis
            const uniqueId = "NOTE-" + Date.now().toString();

            const result = await dbCall({ action: 'insert', sheetName: SHEET_NAME, data: { id: uniqueId, note: noteVal, status: 'active', timestamp: dateStr } });
            
            btn.innerHTML = origHtml; 
            btn.classList.remove('btn-loading');
            
            if(result.status === 'error') {
                alert("Gagal menambahkan! Cek konfigurasi Google Apps Script.");
            } else {
                document.getElementById('formDeadline').reset();
                currentTab = 'active'; switchTab('active');
                await loadDataFast();
            }
        }

        function triggerEdit(id) {
            const noteObj = globalNotes.find(n => n.id === id);
            if(!noteObj) return;

            editingId = id;
            document.getElementById('editNoteInput').value = noteObj.note;
            const modal = document.getElementById('editModal');
            modal.classList.remove('hidden'); modal.classList.add('flex');
            document.body.style.overflow = 'hidden'; 
            document.getElementById('editNoteInput').focus();
        }

        function cancelEdit() {
            editingId = null;
            const modal = document.getElementById('editModal');
            modal.classList.add('hidden'); modal.classList.remove('flex');
            document.body.style.overflow = ''; 
        }

        async function saveEdit(e) {
            e.preventDefault();
            const noteVal = document.getElementById('editNoteInput').value.trim();
            if(!noteVal) return;

            const noteObj = globalNotes.find(n => n.id === editingId);
            if(!noteObj) return;

            const btn = document.getElementById('btnSaveEdit');
            const origHtml = btn.innerHTML;
            btn.innerHTML = '<i class="ph-bold ph-spinner animate-spin text-[16px]"></i> MENYIMPAN...'; 
            btn.classList.add('btn-loading');

            const now = new Date();
            const dateStr = now.toLocaleDateString('id-ID') + ' ' + now.toLocaleTimeString('id-ID', {hour: '2-digit', minute:'2-digit'});

            // PERBAIKAN 3: Merubah ID jadi bentuk Integer/Number (Hanya Jika Berupa Angka Murni) 
            // untuk melewati pengecekan '===' di Backend Apps Script
            const parsedId = isNaN(Number(editingId)) ? editingId : Number(editingId);

            // PERBAIKAN 4: Kirim SEMUA Kolom secara utuh (Termasuk status), jangan biarkan ada yg hilang!
            const result = await dbCall({ 
                action: 'update', 
                sheetName: SHEET_NAME, 
                idValue: parsedId, 
                data: { 
                    note: noteVal, 
                    status: noteObj.status, // <- Ini sebelumnya hilang
                    timestamp: dateStr + ' (Diedit)' 
                } 
            });

            btn.innerHTML = origHtml;
            btn.classList.remove('btn-loading');
            
            if(result.status === 'error') {
                alert("Gagal mengupdate catatan! Kemungkinan Apps Script menolak format ID. Cek Console Browser (F12).");
            } else {
                cancelEdit();
                await loadDataFast();
            }
        }

        async function updateStatus(id, newStatus, btnElement) {
            const noteObj = globalNotes.find(n => n.id === id);
            const origHtml = btnElement.innerHTML;
            btnElement.innerHTML = '<i class="ph-bold ph-spinner animate-spin"></i>'; 
            btnElement.classList.add('btn-loading');
            
            const parsedId = isNaN(Number(id)) ? id : Number(id);

            const result = await dbCall({ 
                action: 'update', 
                sheetName: SHEET_NAME, 
                idValue: parsedId, 
                data: { 
                    note: noteObj.note,
                    status: newStatus, 
                    timestamp: noteObj.timestamp
                } 
            });

            if(result.status === 'error') {
                alert("Gagal memindahkan catatan!");
                btnElement.innerHTML = origHtml;
                btnElement.classList.remove('btn-loading');
            } else {
                await loadDataFast();
            }
        }

        async function deleteNote(id, btnElement) {
            if(confirm('Hapus deadline ini secara permanen?')) {
                const origHtml = btnElement.innerHTML;
                btnElement.innerHTML = '<i class="ph-bold ph-spinner animate-spin"></i>'; 
                btnElement.classList.add('btn-loading');
                
                const parsedId = isNaN(Number(id)) ? id : Number(id);
                
                const result = await dbCall({ action: 'delete', sheetName: SHEET_NAME, idValue: parsedId });
                
                if(result.status === 'error') {
                    alert("Gagal menghapus catatan!");
                    btnElement.innerHTML = origHtml;
                    btnElement.classList.remove('btn-loading');
                } else {
                    await loadDataFast();
                }
            }
        }
    </script>
</body>
</html>
