<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Command Center</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- SheetJS (Export Excel) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: { 
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
                    colors: { 
                        brand: { 50: '#eff6ff', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' }
                    }
                }
            }
        }
    </script>
    
    <style>
        body { background-color: #f8fafc; color: #0f172a; overflow-x: hidden; }
        .card { 
            background-color: #ffffff; 
            border: 1px solid #e2e8f0; 
            border-radius: 16px; 
            box-shadow: 0 2px 10px -2px rgba(0, 0, 0, 0.02); 
        }
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        
        .form-input {
            width: 100%; border: 1px solid #e2e8f0; border-radius: 10px;
            padding: 0.6rem 0.75rem; font-size: 0.8rem; font-weight: 600;
            color: #334155; background-color: #f8fafc; transition: all 0.2s ease;
        }
        .form-input:focus {
            outline: none; border-color: #3b82f6; background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.12);
        }
        
        input[type="radio"]:checked + div.radio-btn {
            background-color: #eff6ff; border-color: #3b82f6; color: #2563eb; font-weight: 700;
        }

        .active-printer .extruder-head { animation: printMove 1.5s infinite alternate ease-in-out; }
        @keyframes printMove { 0% { transform: translateX(-8px); } 100% { transform: translateX(8px); } }

        .modal-bg { opacity: 0; pointer-events: none; transition: opacity 0.25s ease; }
        .modal-panel { transform: translateY(15px) scale(0.97); opacity: 0; transition: all 0.25s ease; }
        .modal-active .modal-bg { opacity: 1; pointer-events: auto; }
        .modal-active .modal-panel { transform: translateY(0) scale(1); opacity: 1; }
    </style>
</head>
<body class="min-h-screen pb-10 font-sans antialiased">

    <div class="w-full max-w-[1600px] mx-auto px-4 sm:px-6 py-5 space-y-6">
        
        <!-- HEADER MINIMALIS -->
        <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center bg-white px-5 py-4 rounded-2xl border border-slate-200 gap-4">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-brand-50 text-brand-600 flex items-center justify-center shrink-0">
                    <i class="ph-duotone ph-cube text-2xl"></i>
                </div>
                <div>
                    <div class="flex items-center gap-2">
                        <h1 class="text-lg sm:text-xl font-extrabold text-slate-800 tracking-tight">Command Center 3D</h1>
                        <span class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse" title="Database Terhubung"></span>
                    </div>
                    <div class="flex items-center gap-2 text-[11px] font-semibold text-slate-400 mt-0.5">
                        <span id="headerDate">-</span>
                        <span>•</span>
                        <span id="headerTime" class="text-brand-600 font-bold">00:00:00</span>
                    </div>
                </div>
            </div>

            <div class="flex items-center gap-2 w-full sm:w-auto">
                <button onclick="downloadExcel()" class="flex-1 sm:flex-none bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2.5 rounded-xl flex justify-center items-center gap-2 transition-all text-xs font-bold shadow-sm active:scale-95">
                    <i class="ph-bold ph-file-xls text-base"></i> Export Excel
                </button>
                <button onclick="fetchData()" id="btnRefresh" class="flex-1 sm:flex-none bg-slate-800 hover:bg-slate-900 text-white px-4 py-2.5 rounded-xl flex justify-center items-center gap-2 transition-all text-xs font-bold shadow-sm active:scale-95">
                    <i class="ph-bold ph-arrows-clockwise text-base"></i> Sync
                </button>
            </div>
        </header>

        <!-- MAIN LAYOUT -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
            
            <!-- KIRI: FORM DELEGASI TUGAS -->
            <div class="lg:col-span-4 xl:col-span-3 card p-5 lg:sticky lg:top-5">
                <div class="flex items-center justify-between mb-4 pb-3 border-b border-slate-100">
                    <h3 class="text-xs font-extrabold text-slate-800 flex items-center gap-2 uppercase tracking-wider">
                        <i class="ph-fill ph-paper-plane-tilt text-brand-500 text-base"></i> Delegasi Tugas
                    </h3>
                </div>
                
                <form onsubmit="kirimTugas(event)" class="space-y-3.5">
                    <div class="grid grid-cols-2 gap-2.5">
                        <div>
                            <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">PIC *</label>
                            <select id="f_pic" required class="form-input cursor-pointer">
                                <option value="" disabled selected>Pilih...</option>
                                <option value="Tania">Tania</option>
                                <option value="Sania">Sania</option>
                                <option value="Mutia">Mutia</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Tim 3D *</label>
                            <select id="f_karyawan" required class="form-input cursor-pointer">
                                <option value="" disabled selected>Pilih...</option>
                                <option value="teguh">Teguh</option>
                                <option value="zalfa">Zalfa</option>
                                <option value="tester">Tester3D</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-2.5">
                        <div>
                            <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Project *</label>
                            <input type="text" id="f_project" list="list_project" placeholder="PLN / Isuzu" required class="form-input">
                            <datalist id="list_project"><option value="PLN"></option><option value="Isuzu"></option><option value="Aqua"></option></datalist>
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">WA Client</label>
                            <input type="tel" id="f_wa" placeholder="0812xxxx" class="form-input">
                        </div>
                    </div>

                    <div class="grid grid-cols-3 gap-2.5">
                        <div class="col-span-2">
                            <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Produk *</label>
                            <input type="text" id="f_produk" list="list_produk" placeholder="Diffuser..." required class="form-input">
                            <datalist id="list_produk"><option value="Diffuser"></option><option value="Hydroflask"></option></datalist>
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Qty *</label>
                            <input type="number" id="f_jumlah" min="1" placeholder="Pcs" required class="form-input text-center">
                        </div>
                    </div>

                    <!-- MESIN, WAKTU START (TANGGAL) & JAM -->
                    <div class="grid grid-cols-12 gap-2">
                        <div class="col-span-4">
                            <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Mesin *</label>
                            <select id="f_mesin" required class="form-input cursor-pointer px-2">
                                <option value="-">Auto</option>
                            </select>
                        </div>
                        <div class="col-span-5">
                            <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Waktu Start *</label>
                            <input type="date" id="f_start_date" required class="form-input px-2 text-[11px]">
                        </div>
                        <div class="col-span-3">
                            <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Jam *</label>
                            <input type="time" id="f_start_time" required class="form-input px-1.5 text-[11px] text-center">
                        </div>
                    </div>

                    <!-- UPLOAD FOTO COMPACT -->
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Foto Visual <span class="lowercase font-normal">(opsional)</span></label>
                        <div class="border border-dashed border-slate-300 rounded-xl p-3 text-center transition-all bg-slate-50 hover:bg-brand-50/50 hover:border-brand-400 relative cursor-pointer">
                            <input type="file" id="f_foto" accept="image/*" onchange="previewImage(event)" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">
                            <div id="upload-placeholder" class="py-1 flex items-center justify-center gap-2 text-slate-500">
                                <i class="ph-duotone ph-image text-lg text-brand-500"></i>
                                <span class="text-[11px] font-semibold">Pilih / Drop Foto</span>
                            </div>
                            <div id="preview-container" class="hidden relative z-20 flex items-center justify-between gap-2">
                                <img id="img-preview" src="" class="h-12 w-12 rounded-lg object-cover border border-slate-200 bg-white">
                                <button type="button" onclick="resetImage(event)" class="text-[10px] bg-red-50 text-red-600 font-bold px-3 py-1.5 rounded-lg hover:bg-red-100">Hapus</button>
                            </div>
                        </div>
                    </div>

                    <div class="flex gap-2 pt-1">
                        <label class="flex-1 cursor-pointer">
                            <input type="radio" name="f_tipe" value="Bikin Mockup" class="peer hidden" checked>
                            <div class="radio-btn border border-slate-200 text-slate-500 rounded-xl py-2.5 text-center text-[11px] font-semibold transition-all">Mockup</div>
                        </label>
                        <label class="flex-1 cursor-pointer">
                            <input type="radio" name="f_tipe" value="Langsung Produksi" class="peer hidden">
                            <div class="radio-btn border border-slate-200 text-slate-500 rounded-xl py-2.5 text-center text-[11px] font-semibold transition-all">Produksi</div>
                        </label>
                    </div>

                    <button type="submit" id="btnSubmitTugas" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-bold py-3 rounded-xl text-xs uppercase tracking-wider transition-all shadow-sm flex justify-center items-center gap-2">
                        <i class="ph-bold ph-paper-plane-right"></i> Tugaskan
                    </button>
                </form>
            </div>

            <!-- KANAN: DASHBOARD & MONITOR -->
            <div class="lg:col-span-8 xl:col-span-9 flex flex-col gap-6">
                
                <!-- STATISTIK RINGKAS -->
                <div class="grid grid-cols-2 lg:grid-cols-4 gap-3.5">
                    <div class="card p-4 border-l-4 border-l-blue-500">
                        <div class="flex justify-between items-center text-[10px] font-bold text-slate-400 uppercase">
                            <span>Hari Ini</span> <i class="ph-duotone ph-scales text-blue-500 text-base"></i>
                        </div>
                        <h3 class="text-xl font-extrabold text-slate-800 mt-1" id="stat-gram-today">0 gr</h3>
                    </div>
                    <div class="card p-4 border-l-4 border-l-indigo-500">
                        <div class="flex justify-between items-center text-[10px] font-bold text-slate-400 uppercase">
                            <span>Bulan Ini</span> <i class="ph-duotone ph-calendar text-indigo-500 text-base"></i>
                        </div>
                        <h3 class="text-xl font-extrabold text-slate-800 mt-1" id="stat-gram-month">0 gr</h3>
                    </div>
                    <div class="card p-4 border-l-4 border-l-purple-500">
                        <div class="flex justify-between items-center text-[10px] font-bold text-slate-400 uppercase">
                            <span>Tahun Ini</span> <i class="ph-duotone ph-chart-line-up text-purple-500 text-base"></i>
                        </div>
                        <h3 class="text-xl font-extrabold text-slate-800 mt-1" id="stat-gram-year">0 gr</h3>
                    </div>
                    <div class="card p-4 border-l-4 border-l-emerald-500">
                        <div class="flex justify-between items-center text-[10px] font-bold text-emerald-600 uppercase">
                            <span>Total Mesin</span> <i class="ph-duotone ph-cpu text-emerald-500 text-base"></i>
                        </div>
                        <h3 class="text-xl font-extrabold text-slate-800 mt-1 truncate" id="stat-pernah-list">0 Mesin</h3>
                    </div>
                </div>

                <!-- FARM MONITORING -->
                <div class="card overflow-hidden">
                    <div class="px-5 py-4 border-b border-slate-100 flex justify-between items-center bg-white">
                        <h3 class="text-xs font-extrabold text-slate-800 flex items-center gap-2 uppercase tracking-wider">
                            <i class="ph-fill ph-printer-3d text-brand-500 text-base"></i> Farm Monitoring
                        </h3>
                        <button onclick="toggleModal('modalMesin')" id="stat-mesin-today" class="bg-emerald-500 hover:bg-emerald-600 text-white px-3.5 py-1.5 rounded-full text-[11px] font-bold transition-all flex items-center gap-1.5 cursor-pointer">
                            <span class="w-1.5 h-1.5 bg-white rounded-full animate-pulse"></span> 0 Mesin Jalan
                        </button>
                    </div>
                    <div class="p-4 sm:p-5 bg-slate-50/40">
                        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 xl:grid-cols-5 gap-3" id="mesin-3d-grid"></div>
                    </div>
                </div>

                <!-- KANBAN BOARD -->
                <div class="card flex flex-col">
                    <div class="px-5 py-4 border-b border-slate-100 bg-white rounded-t-2xl flex flex-col xl:flex-row justify-between items-start xl:items-center gap-3">
                        <h3 class="text-xs font-extrabold text-slate-800 flex items-center gap-2 uppercase tracking-wider">
                            <i class="ph-fill ph-kanban text-brand-500 text-base"></i> Papan Produksi
                        </h3>

                        <div class="flex flex-wrap items-center gap-2 w-full xl:w-auto justify-between xl:justify-end">
                            <div class="flex items-center gap-1 bg-slate-100 p-1 rounded-xl overflow-x-auto">
                                <button onclick="setKanbanFilter('aktif')" id="kfilter-aktif" class="px-2.5 py-1 rounded-lg text-[10px] font-bold uppercase bg-white text-brand-600 shadow-sm">Aktif</button>
                                <button onclick="setKanbanFilter('produksi')" id="kfilter-produksi" class="px-2.5 py-1 rounded-lg text-[10px] font-semibold uppercase text-slate-500 hover:text-slate-800">Produksi</button>
                                <button onclick="setKanbanFilter('dikerjain')" id="kfilter-dikerjain" class="px-2.5 py-1 rounded-lg text-[10px] font-semibold uppercase text-slate-500 hover:text-slate-800">Mockup</button>
                                <button onclick="setKanbanFilter('menunggu')" id="kfilter-menunggu" class="px-2.5 py-1 rounded-lg text-[10px] font-semibold uppercase text-slate-500 hover:text-slate-800">Antre</button>
                                <button onclick="setKanbanFilter('semua')" id="kfilter-semua" class="px-2.5 py-1 rounded-lg text-[10px] font-semibold uppercase text-slate-500 hover:text-slate-800">Semua</button>
                            </div>

                            <div class="relative flex-1 sm:w-44">
                                <i class="ph-bold ph-magnifying-glass absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                                <input type="text" id="kanbanSearchInput" oninput="handleKanbanSearch(this.value)" placeholder="Cari project / WA..." class="w-full pl-7 pr-3 py-1.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-medium text-slate-700 focus:outline-none focus:border-brand-500 focus:bg-white">
                            </div>
                        </div>
                    </div>
                    
                    <div class="p-4 sm:p-5 bg-slate-50/40">
                        <div id="global-error" class="hidden p-3.5 mb-4 rounded-xl bg-red-50 border border-red-200 text-red-600 text-xs font-bold flex items-center gap-2">
                            <i class="ph-fill ph-warning-circle text-lg"></i>
                            <div id="global-error-text">Terjadi kesalahan.</div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4" id="kanban-board">
                            <!-- Teguh -->
                            <div class="bg-white p-3.5 rounded-xl border border-slate-200/80 flex flex-col">
                                <div class="flex items-center justify-between mb-3 pb-2.5 border-b border-slate-100">
                                    <div class="flex items-center gap-2">
                                        <span class="w-6 h-6 rounded-full bg-blue-50 text-blue-600 text-[11px] font-extrabold flex items-center justify-center">TG</span>
                                        <h4 class="font-extrabold text-slate-800 text-xs uppercase tracking-wider">Teguh</h4>
                                    </div>
                                    <span class="bg-slate-100 text-slate-600 py-0.5 px-2 rounded-md text-[10px] font-extrabold" id="count-teguh">0</span>
                                </div>
                                <div class="flex flex-col gap-3 max-h-[700px] overflow-y-auto pr-1" id="col-teguh"></div>
                            </div>
                            
                            <!-- Zalfa -->
                            <div class="bg-white p-3.5 rounded-xl border border-slate-200/80 flex flex-col">
                                <div class="flex items-center justify-between mb-3 pb-2.5 border-b border-slate-100">
                                    <div class="flex items-center gap-2">
                                        <span class="w-6 h-6 rounded-full bg-purple-50 text-purple-600 text-[11px] font-extrabold flex items-center justify-center">ZA</span>
                                        <h4 class="font-extrabold text-slate-800 text-xs uppercase tracking-wider">Zalfa</h4>
                                    </div>
                                    <span class="bg-slate-100 text-slate-600 py-0.5 px-2 rounded-md text-[10px] font-extrabold" id="count-zalfa">0</span>
                                </div>
                                <div class="flex flex-col gap-3 max-h-[700px] overflow-y-auto pr-1" id="col-zalfa"></div>
                            </div>

                            <!-- Tester3D -->
                            <div class="bg-white p-3.5 rounded-xl border border-slate-200/80 flex flex-col">
                                <div class="flex items-center justify-between mb-3 pb-2.5 border-b border-slate-100">
                                    <div class="flex items-center gap-2">
                                        <span class="w-6 h-6 rounded-full bg-slate-100 text-slate-600 text-[11px] font-extrabold flex items-center justify-center">TS</span>
                                        <h4 class="font-extrabold text-slate-800 text-xs uppercase tracking-wider">Tester3D</h4>
                                    </div>
                                    <span class="bg-slate-100 text-slate-600 py-0.5 px-2 rounded-md text-[10px] font-extrabold" id="count-tester3d">0</span>
                                </div>
                                <div class="flex flex-col gap-3 max-h-[700px] overflow-y-auto pr-1" id="col-tester3d"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- RIWAYAT AKTIVITAS -->
                <div class="card overflow-hidden">
                    <div class="px-5 py-3.5 border-b border-slate-100 bg-white flex justify-between items-center">
                        <h3 class="text-xs font-extrabold text-slate-800 flex items-center gap-2 uppercase tracking-wider">
                            <i class="ph-fill ph-list-dashes text-brand-500 text-base"></i> Log Aktivitas
                        </h3>
                        <div class="flex gap-3 text-[10px] font-bold uppercase">
                            <button onclick="setTab('Semua')" id="tab-Semua" class="text-brand-600 border-b-2 border-brand-600 pb-0.5">Semua</button>
                            <button onclick="setTab('teguh')" id="tab-teguh" class="text-slate-400 border-b-2 border-transparent pb-0.5 hover:text-slate-700">Teguh</button>
                            <button onclick="setTab('zalfa')" id="tab-zalfa" class="text-slate-400 border-b-2 border-transparent pb-0.5 hover:text-slate-700">Zalfa</button>
                            <button onclick="setTab('tester')" id="tab-tester" class="text-slate-400 border-b-2 border-transparent pb-0.5 hover:text-slate-700">Tester</button>
                        </div>
                    </div>
                    <div class="max-h-[240px] overflow-y-auto bg-white">
                        <table class="w-full text-left">
                            <tbody id="log-container" class="divide-y divide-slate-50"></tbody>
                        </table>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- MODAL DETAIL MESIN JALAN -->
    <div id="modalMesin" class="fixed inset-0 z-50 flex items-center justify-center modal-bg">
        <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm" onclick="toggleModal('modalMesin')"></div>
        <div class="relative bg-white rounded-2xl shadow-xl border border-slate-100 w-11/12 max-w-md modal-panel overflow-hidden flex flex-col max-h-[80vh]">
            <div class="px-5 py-4 border-b border-slate-100 flex justify-between items-center">
                <h3 class="text-sm font-extrabold text-slate-800 flex items-center gap-2">
                    <i class="ph-fill ph-printer-3d text-emerald-500 text-lg"></i> Detail Mesin Berjalan
                </h3>
                <button onclick="toggleModal('modalMesin')" class="w-7 h-7 rounded-full bg-slate-100 text-slate-500 hover:bg-slate-200 flex items-center justify-center">
                    <i class="ph-bold ph-x text-xs"></i>
                </button>
            </div>
            <div class="p-4 overflow-y-auto flex-1 bg-white">
                <ul id="modal-list-mesin" class="space-y-2.5"></ul>
            </div>
        </div>
    </div>

    <script>
        const APPSCRIPT_URL = "https://script.google.com/macros/s/AKfycbxowuOA-SAq4m4a5sGRljiP8vp7yPkO5QunSGH8WBOJyKiQyGbp_FyY7A6pNGfY6y0rBg/exec"; 
        const SPREADSHEET_ID = "1d3njy330ifMnm-uBD8daaey5AqYO3rQxaI-tLZQdeyI";
        const cloudName = 'sp3gkuvt';
        const uploadPreset = 'mlsdata';
        const cloudinaryUrl = `https://api.cloudinary.com/v1_1/${cloudName}/image/upload`;

        let allLogs = [];
        let allKaryawanData = [];
        let currentTab = 'Semua';
        let kanbanFilter = 'aktif';
        let kanbanSearch = '';
        
        const BASE_MACHINES = ["A1.1", "A1.2", "A1.3", "A1.4", "A1.5", "A1.6", "A1.7", "A1.8", "A1.9", "A1.10", "A1.11", "A2.1", "A2.2", "C1.1"];

        function setDefaultStartDateTime() {
            const now = new Date();
            const yyyy = now.getFullYear();
            const mm = String(now.getMonth() + 1).padStart(2, '0');
            const dd = String(now.getDate()).padStart(2, '0');
            const hh = String(now.getHours()).padStart(2, '0');
            const min = String(now.getMinutes()).padStart(2, '0');
            
            document.getElementById('f_start_date').value = `${yyyy}-${mm}-${dd}`;
            document.getElementById('f_start_time').value = `${hh}:${min}`;
        }

        document.addEventListener('DOMContentLoaded', () => {
            const now = new Date();
            document.getElementById('headerDate').innerText = now.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
            setDefaultStartDateTime();
            
            setInterval(() => {
                document.getElementById('headerTime').innerText = new Date().toLocaleTimeString('id-ID', {hour: '2-digit', minute:'2-digit', second:'2-digit'});

        function toggleModal(modalID) {

        }

        function cleanVal(v) {
            if (v === undefined || v === null) return '';
            const s = String(v).trim();
            return s === '-' ? '' : s;
        }

        // ==========================================
        // FORMATTER TANGGAL + JAM (SELALU TAMPIL TANGGAL & JAM)
        // ==========================================
        function extractDateFromTask(taskObj = {}, parsed = {}) {
            // 1. Cek dari parsed.tgl (jika ada format DD/MM/YYYY atau YYYY-MM-DD)
            const candidates = [parsed.tgl, taskObj.startTime, taskObj.waktu];
            for (const c of candidates) {
                if (!c || c === '-') continue;
                const s = String(c).trim();
                const matchDMY = s.match(/(\d{1,2}[\/\-]\d{1,2}[\/\-]\d{2,4})/);
                if (matchDMY) return matchDMY[1].replace(/\-/g, '/');
                const matchYMD = s.match(/(\d{4}\-\d{2}\-\d{2})/);
                if (matchYMD) {
                    const [y, m, d] = matchYMD[1].split('-');
                    return `${d}/${m}/${y}`;
                }
            }
            // 2. Cek dari ID (Unix Timestamp ms di Kolom A)
            const rawId = String(taskObj.id || '').trim();
            if (/^\d{12,14}$/.test(rawId)) {
                const d = new Date(Number(rawId));
                if (!isNaN(d.getTime())) {
                    return d.toLocaleDateString('id-ID', { day: '2-digit', month: '2-digit', year: 'numeric' });
                }
            }
            return '';
        }

        function formatFullDateTime(rawWaktu, taskObj = {}, parsed = {}) {
            const fallbackDate = extractDateFromTask(taskObj, parsed);
            const fallbackTime = cleanVal(parsed.jam);

            if (!rawWaktu || rawWaktu === '-') {
                if (fallbackDate && fallbackTime) return `${fallbackDate} • ${fallbackTime}`;
                return fallbackDate || fallbackTime || '-';
            }

            const str = String(rawWaktu).trim();

            // Jika format ISO Date
            if (str.includes('T') && str.endsWith('Z')) {
                const d = new Date(str);
                if (!isNaN(d.getTime())) {
                    const tgl = d.toLocaleDateString('id-ID', { day: '2-digit', month: '2-digit', year: 'numeric' });
                    const jam = d.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }).replace('.', ':');
                    return `${tgl} • ${jam}`;
                }
            }

            // Jika sudah mengandung spasi (Contoh: "03/11/2026 15.16" atau "2026-11-05 14:30")
            if (str.includes(' ')) {
                const parts = str.split(/\s+/);
                let dPart = parts[0];
                let tPart = parts.slice(1).join(' ').replace('.', ':');
                if (/^\d{4}-\d{2}-\d{2}$/.test(dPart)) {
                    const [y, m, d] = dPart.split('-');
                    dPart = `${d}/${m}/${y}`;
                }
                return `${dPart} • ${tPart}`;
            }

            // Jika hanya berisi jam (Contoh: "15.16", "08.28", "8:00")
            if (/^\d{1,2}[:.]\d{2}([:.]\d{2})?$/.test(str)) {
                const jamClean = str.substring(0, 5).replace('.', ':');
                return fallbackDate ? `${fallbackDate} • ${jamClean}` : jamClean;
            }

            // Jika hanya berisi tanggal (Contoh: "03/11/2026" atau "2026-11-05")
            let dateClean = str;
            if (/^\d{4}-\d{2}-\d{2}$/.test(str)) {
                const [y, m, d] = str.split('-');
                dateClean = `${d}/${m}/${y}`;
            }
            if (fallbackTime) return `${dateClean} • ${fallbackTime.replace('.', ':')}`;
            return dateClean;
        }

        function previewImage(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('img-preview').src = e.target.result;
                document.getElementById('upload-placeholder').classList.add('hidden');
                document.getElementById('preview-container').classList.remove('hidden');
            };
            reader.readAsDataURL(file);
        }

        function resetImage(event) {
            if (event) event.stopPropagation();
            document.getElementById('f_foto').value = "";
            document.getElementById('img-preview').src = "";
            document.getElementById('upload-placeholder').classList.remove('hidden');
            document.getElementById('preview-container').classList.add('hidden');
        }

        async function uploadToCloudinary(file) {
            const formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', uploadPreset);
            const response = await fetch(cloudinaryUrl, { method: 'POST', body: formData });
            if (!response.ok) throw new Error('Gagal upload foto');
            const data = await response.json();
            return data.secure_url;
        }

        // ==========================================
        // 3. FETCH DATA HYBRID (APPSCRIPT + GVIZ)

        async function fetchDirectSheetRows() {

            const cols = data.table.cols.map(c => c ? (c.label || c.id || '') : '').map(l => l.trim());
            return data.table.rows.map((r) => {
                let row = {};
                r.c.forEach((c, i) => {
                    const key = cols[i] || `col_${i}`;
                    row[key] = c ? (c.f !== undefined && c.f !== null ? c.f : (c.v !== null ? c.v : '')) : '';
                });
                if (!row.id && r.c[0]?.v) row.id = r.c[0].v;

        async function fetchData() {
            const btn = document.getElementById('btnRefresh');
            const icon = btn.querySelector('i');
            const errBox = document.getElementById('global-error');
            
            icon.classList.add('animate-spin');
            errBox.classList.add('hidden');
            
            try {
                const payload = { sheetName: "tasks_3d", action: "get_dashboard" };
                const [appScriptRes, directRowsRes] = await Promise.allSettled([
                    fetch(APPSCRIPT_URL, {
                        method: "POST", headers: { "Content-Type": "text/plain" }, 
                        body: JSON.stringify(payload), redirect: 'follow' 
                    }).then(r => r.json()),
                    fetchDirectSheetRows()
                ]);

                let data = { stats: {}, karyawan: [], logs: [] };
                if (appScriptRes.status === 'fulfilled' && appScriptRes.value.status === 'success') {
                    data = appScriptRes.value.data;
                }

                const directRows = directRowsRes.status === 'fulfilled' ? directRowsRes.value : [];

                document.getElementById('stat-gram-today').innerText = data.stats?.gramasiToday || "0 gr";
                document.getElementById('stat-gram-month').innerText = data.stats?.gramasiMonth || "0 gr"; 
                document.getElementById('stat-gram-year').innerText = data.stats?.gramasiYear || "0 gr";
                
                const mPernah = data.stats?.pernahJalanArray || [];
                document.getElementById('stat-pernah-list').innerText = mPernah.length + " Mesin";

                if (directRows.length > 0) {
                    allKaryawanData = directRows
                        .filter(r => r.assignee && String(r.projectName || '').trim() !== '')
                        .map(r => ({
                            id: r.id,
                            nama: r.assignee,
                            project: r.projectName,
                            catatanAdmin: r.catatanAdmin,
                            status: r.status || 'Menunggu Konfirmasi',
                            mesin: r.mesin || '-',
                            gramasi: r.gramasi || r.beratParts || '-',
                            jumlah: r.jumlah || '-',
                            waktu: (r.waktuMesinJalan && r.waktuMesinJalan !== '-') ? r.waktuMesinJalan : (r.startTime || '-'),
                            startTime: r.startTime || '-',
                            endTime: r.endTime || '-',
                            catatanTim: r.catatanTim || '-',
                            namaParts: r.namaParts || '',
                            jumlahParts: r.jumlahParts || '',
                            warnaParts: r.warnaParts || '',
                            beratParts: r.beratParts || '',
                            waktuProd: r.waktuProd || '',
                            jmlPerProd: r.jmlPerProd || '',
                            noteTim: r.noteTim || '',
                            picAdmin: r.picAdmin || '',
                            namaProduk: r.namaProduk || '',
                            tipeKerja: r.tipeKerja || '',
                            fotoUrl: r.fotoUrl || '',
                            noWa: r.noWa || '',
                            jamStart: r.jamStart || ''
                        }));
                } else {
                    allKaryawanData = data.karyawan || [];
                }

                renderMesin3D(mPernah, allKaryawanData);

            } catch (error) {
                errBox.classList.remove('hidden');
                document.getElementById('global-error-text').innerText = `Gagal memuat data: ${error.message}`;
            } finally {
                icon.classList.remove('animate-spin');
            }
        }

                    + (fotoUrl ? ` | FOTO:${fotoUrl}` : '');

                        projectName: packedProject,

        // ==========================================
        // 5. PARSER PROJECT & PARTS
        // ==========================================
        function parseProjectInfo(rawProject, taskObj = {}) {
            const info = {
                title: rawProject || '-',
                pic: cleanVal(taskObj.picAdmin) || null,
                wa: cleanVal(taskObj.noWa) || null,
                qty: cleanVal(taskObj.jumlah) || null,
                tgl: cleanVal(taskObj.startTime) || null,
                jam: cleanVal(taskObj.jamStart) || null,
                tipe: cleanVal(taskObj.tipeKerja) || null,
                foto: cleanVal(taskObj.fotoUrl) || null
            };

            if (rawProject && rawProject.includes('|')) {
                const parts = rawProject.split('|').map(s => s.trim());
                info.title = parts[0] || rawProject;
                for (let i = 1; i < parts.length; i++) {
                    const p = parts[i];
                    if (p.startsWith('PIC:')) info.pic = p.replace('PIC:', '').trim();
                    else if (p.startsWith('WA:')) info.wa = p.replace('WA:', '').trim();
                    else if (p.startsWith('QTY:')) info.qty = p.replace('QTY:', '').trim();
                    else if (p.startsWith('TGL:')) info.tgl = p.replace('TGL:', '').trim();
                    else if (p.startsWith('JAM:')) info.jam = p.replace('JAM:', '').trim();
                    else if (p.startsWith('DL:') && !info.tgl) info.tgl = p.replace('DL:', '').trim();
                    else if (p.startsWith('TIPE:')) info.tipe = p.replace('TIPE:', '').trim();
                    else if (p.startsWith('FOTO:')) info.foto = p.replace('FOTO:', '').trim();
                }
            }

            if (taskObj.catatanAdmin && taskObj.catatanAdmin !== '-') {
                const cParts = String(taskObj.catatanAdmin).split('|').map(s => s.trim());
                if (!info.tipe) info.tipe = cParts[0];
                cParts.forEach(cp => {
                    if (!info.wa && cp.toLowerCase().startsWith('wa:')) info.wa = cp.substring(3).trim();
                    if (!info.foto && cp.toLowerCase().startsWith('foto:')) info.foto = cp.substring(5).trim();
                });
            }

            // Jika endTime berisi format jam (HH:mm), gunakan sebagai fallback jam
            const endVal = cleanVal(taskObj.endTime);
            if (!info.jam && /^\d{1,2}[:.]\d{2}$/.test(endVal)) {
                info.jam = endVal.replace('.', ':');
            }

            return info;
        }

        function parsePartsData3D(k) {
            const res = {
                namaParts: cleanVal(k.namaParts),
                jumlahParts: cleanVal(k.jumlahParts),
                warnaParts: cleanVal(k.warnaParts),
                beratParts: cleanVal(k.beratParts) || (cleanVal(k.gramasi) ? cleanVal(k.gramasi).replace(/[^0-9.]/g, '') : ''),
                waktuProd: cleanVal(k.waktuProd),
                jmlPerProd: cleanVal(k.jmlPerProd),
                note: cleanVal(k.noteTim)
            };

            const rawCat = cleanVal(k.catatanTim);
            if (!rawCat) return res;

            if (!rawCat.includes('PARTS:') && !rawCat.includes('WARNA:') && !rawCat.includes('WAKTU_PROD:')) {
                if (!res.note) res.note = rawCat;
                return res;
            }

            rawCat.split('|').map(s => s.trim()).forEach(seg => {
                if (seg.startsWith('PARTS:') && !res.namaParts) res.namaParts = cleanVal(seg.replace('PARTS:', ''));
                else if (seg.startsWith('JML_PART:') && !res.jumlahParts) res.jumlahParts = cleanVal(seg.replace('JML_PART:', ''));
                else if (seg.startsWith('WARNA:') && !res.warnaParts) res.warnaParts = cleanVal(seg.replace('WARNA:', ''));
                else if (seg.startsWith('BERAT:') && !res.beratParts) res.beratParts = cleanVal(seg.replace('BERAT:', '').replace(/g$/i, ''));
                else if (seg.startsWith('WAKTU_PROD:') && !res.waktuProd) res.waktuProd = cleanVal(seg.replace('WAKTU_PROD:', '').replace(/m$/i, ''));
                else if (seg.startsWith('PER_PROD:') && !res.jmlPerProd) res.jmlPerProd = cleanVal(seg.replace('PER_PROD:', ''));
                else if (seg.startsWith('NOTE:') && !res.note) res.note = cleanVal(seg.replace('NOTE:', ''));
            });

            return res;
        }

        // ==========================================
        // 6. KARTU KANBAN MINIMALIS (TANGGAL + JAM LENGKAP)
        // ==========================================
        function createCardHTML(k) {
            let statusColor = "bg-slate-100 text-slate-600 border-slate-200";
            let statusIcon = "ph-circle-dashed";
            let borderColor = "border-slate-200/90";
            
            const statusStr = (k.status || '').toLowerCase();

            if(statusStr.includes("produksi") || statusStr.includes("mesin jalan")) {
                statusColor = "bg-emerald-50 text-emerald-700 border-emerald-200";
                statusIcon = "ph-printer-3d text-emerald-600 animate-pulse";
                borderColor = "border-emerald-200";
            } else if(statusStr.includes("dikerjain")) {
                statusColor = "bg-red-50 text-red-600 border-red-200";
                statusIcon = "ph-wrench text-red-500";
                borderColor = "border-red-200";
            } else if(statusStr.includes("revisi")) {
                statusColor = "bg-amber-50 text-amber-700 border-amber-200";
                statusIcon = "ph-warning-circle text-amber-500";
                borderColor = "border-amber-200";
            } else if(statusStr.includes("selesai") || statusStr.includes("done")) {
                statusColor = "bg-blue-50 text-blue-600 border-blue-200";
                statusIcon = "ph-check-circle text-blue-600";
                borderColor = "border-blue-200";
            }

            const parsed = parseProjectInfo(k.project, k);
            const partsInfo = parsePartsData3D(k);

            const displayMesin = k.mesin && k.mesin !== '-' ? k.mesin.replace(/mesin/gi, '').trim().toUpperCase() : 'Auto';
            const rawGramasi = partsInfo.beratParts || cleanVal(k.gramasi);
            const displayGramasi = rawGramasi ? `${String(rawGramasi).replace(/gr|g/gi, '').trim()} gr` : '';
            
            // Waktu Badge & Start selalu menampilkan Tanggal + Jam
            const waktuTopBadge = formatFullDateTime(k.waktu || parsed.tgl, k, parsed);
            const waktuStartDisplay = formatFullDateTime(parsed.tgl || k.startTime, k, parsed);

            const waClean = parsed.wa ? String(parsed.wa).replace(/\D/g, '').replace(/^0/, '62') : '';
            const waText = encodeURIComponent(`Halo Kak, update pengerjaan 3D untuk project *${parsed.title}*`);

            const hasPartsData = partsInfo.namaParts || partsInfo.jumlahParts || partsInfo.warnaParts || partsInfo.beratParts || partsInfo.waktuProd || partsInfo.jmlPerProd || partsInfo.note;
            
            const specBlock = hasPartsData ? `
                <div class="p-2.5 bg-slate-50 border border-slate-100 rounded-xl grid grid-cols-2 gap-x-2 gap-y-1 text-[10px]">
                    ${partsInfo.namaParts ? `<div><span class="text-slate-400">Part:</span> <b class="text-slate-700">${partsInfo.namaParts}</b></div>` : ''}
                    ${partsInfo.jumlahParts ? `<div><span class="text-slate-400">Jml:</span> <b class="text-slate-700">${partsInfo.jumlahParts}</b></div>` : ''}
                    ${partsInfo.warnaParts ? `<div><span class="text-slate-400">Warna:</span> <b class="text-slate-700">${partsInfo.warnaParts}</b></div>` : ''}
                    ${partsInfo.beratParts ? `<div><span class="text-slate-400">Berat:</span> <b class="text-emerald-700">${partsInfo.beratParts} gr</b></div>` : ''}
                    ${partsInfo.waktuProd ? `<div><span class="text-slate-400">Durasi:</span> <b class="text-slate-700">${partsInfo.waktuProd} m</b></div>` : ''}
                    ${partsInfo.jmlPerProd ? `<div><span class="text-slate-400">Batch:</span> <b class="text-slate-700">${partsInfo.jmlPerProd}</b></div>` : ''}
                    ${partsInfo.note ? `<div class="col-span-2 pt-1 mt-0.5 border-t border-slate-200/60 text-slate-600 italic">"${partsInfo.note}"</div>` : ''}
                </div>
            ` : '';

            return `
            <div class="bg-white border ${borderColor} p-3.5 rounded-xl shadow-sm hover:shadow transition-all flex flex-col gap-2.5">
                <!-- Baris Status & Tanggal/Jam -->
                <div class="flex justify-between items-center gap-1.5">
                    <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md text-[9px] font-extrabold border uppercase ${statusColor}">
                        <i class="ph-fill ${statusIcon}"></i> ${k.status}
                    </span>
                    <span class="inline-flex items-center gap-1 bg-slate-50 border border-slate-200/70 px-2 py-0.5 rounded-md text-[9px] font-bold text-slate-500">
                        <i class="ph-bold ph-calendar-blank text-slate-400"></i> ${waktuTopBadge}
                    </span>
                </div>

                <!-- Judul & Badges Ringkas -->
                <div>
                    <h4 class="text-xs font-extrabold text-slate-800 leading-snug">${parsed.title}</h4>
                    <div class="flex flex-wrap items-center gap-1 mt-1.5">
                        ${parsed.pic ? `<span class="bg-violet-50 text-violet-700 px-1.5 py-0.5 rounded text-[9px] font-bold border border-violet-100">PIC: ${parsed.pic}</span>` : ''}
                        ${parsed.tipe ? `<span class="bg-blue-50 text-blue-700 px-1.5 py-0.5 rounded text-[9px] font-bold border border-blue-100">${parsed.tipe}</span>` : ''}
                        ${parsed.wa ? `<a href="https://wa.me/${waClean}?text=${waText}" target="_blank" class="inline-flex items-center bg-emerald-50 hover:bg-emerald-100 text-emerald-700 px-1.5 py-0.5 rounded text-[9px] font-bold border border-emerald-200"><i class="ph-fill ph-whatsapp-logo mr-0.5"></i>${parsed.wa}</a>` : ''}
                        ${parsed.foto && parsed.foto.startsWith('http') ? `<a href="${parsed.foto}" target="_blank" class="inline-flex items-center bg-slate-100 hover:bg-slate-200 text-slate-700 px-1.5 py-0.5 rounded text-[9px] font-bold"><i class="ph-bold ph-image mr-0.5"></i>Foto</a>` : ''}
                    </div>
                </div>

                ${(parsed.foto && parsed.foto.startsWith('http')) ? `
                <a href="${parsed.foto}" target="_blank" class="block overflow-hidden rounded-lg border border-slate-100">
                    <img src="${parsed.foto}" class="w-full h-24 object-cover hover:scale-105 transition-transform duration-300">
                </a>` : ''}

                <!-- Info Strip Minimalis (Qty, Mesin, Waktu Start + Tanggal) -->
                <div class="grid grid-cols-3 gap-1.5 text-[10px] bg-slate-50/80 p-2 rounded-lg border border-slate-100">
                    <div>
                        <span class="block text-[8px] uppercase text-slate-400 font-bold">Qty</span>
                        <span class="font-extrabold text-slate-700">${parsed.qty || '-'} pcs</span>
                    </div>
                    <div>
                        <span class="block text-[8px] uppercase text-slate-400 font-bold">Mesin</span>
                        <span class="font-extrabold text-slate-700 truncate block">${displayMesin}</span>
                    </div>
                    <div>
                        <span class="block text-[8px] uppercase text-slate-400 font-bold">Start</span>
                        <span class="font-extrabold text-slate-700 block leading-tight text-[9px]">${waktuStartDisplay}</span>
                    </div>
                </div>

                ${specBlock}

                ${displayGramasi ? `
                <div class="flex justify-between items-center px-2.5 py-1.5 bg-indigo-50/50 rounded-lg border border-indigo-100 text-[10px]">
                    <span class="font-bold text-indigo-500 uppercase text-[8px]">Total Berat</span>
                    <span class="font-extrabold text-indigo-700">${displayGramasi}</span>
                </div>` : ''}
            </div>`;
        }

        // ==========================================
        // 7. FILTER KANBAN & RENDERING
        // ==========================================
        function setKanbanFilter(filterName) {
            kanbanFilter = filterName;
            ['aktif', 'produksi', 'dikerjain', 'menunggu', 'semua'].forEach(f => {
                const btn = document.getElementById(`kfilter-${f}`);
                if (!btn) return;
                btn.className = f === filterName
                    ? "px-2.5 py-1 rounded-lg text-[10px] font-bold uppercase bg-white text-brand-600 shadow-sm"
                    : "px-2.5 py-1 rounded-lg text-[10px] font-semibold uppercase text-slate-500 hover:text-slate-800";
            });
            renderEmployeeStatus();
        }

        function handleKanbanSearch(val) {
            kanbanSearch = val.toLowerCase().trim();
            renderEmployeeStatus();
        }

        function getStatusPriority(status) {
            const s = (status || '').toLowerCase();
            if(s.includes('produksi') || s.includes('jalan')) return 3; 
            if(s.includes('dikerjain')) return 2;
            if(s.includes('revisi')) return 1;
            return 0; 
        }

        function matchKanbanFilter(k) {
            const s = (k.status || '').toLowerCase();
            if (kanbanFilter === 'aktif') {
                if (s.includes('selesai') || s.includes('done') || s.includes('batal')) return false;
            } else if (kanbanFilter === 'produksi') {
                if (!s.includes('produksi') && !s.includes('jalan')) return false;
            } else if (kanbanFilter === 'dikerjain') {
                if (!s.includes('dikerjain') && !s.includes('revisi') && !s.includes('mockup')) return false;
            } else if (kanbanFilter === 'menunggu') {
                if (!s.includes('menunggu') && !s.includes('antre')) return false;
            }

            if (kanbanSearch) {
                const hay = `${k.project || ''} ${k.noWa || ''} ${k.catatanTim || ''} ${k.namaParts || ''} ${k.warnaParts || ''} ${k.noteTim || ''} ${k.mesin || ''} ${k.status || ''}`.toLowerCase();
                if (!hay.includes(kanbanSearch)) return false;
            }
            return true;
        }

        function renderEmployeeStatus() {
            let htmlTeguh = '', htmlZalfa = '', htmlTester = '';
            let countTeguh = 0, countZalfa = 0, countTester = 0;

            const sortedData = [...allKaryawanData].sort((a, b) => getStatusPriority(b.status) - getStatusPriority(a.status));

            sortedData.forEach(k => {
                if (!matchKanbanFilter(k)) return;
                const nameLow = (k.nama || '').toLowerCase();
                const cardHTML = createCardHTML(k);
                if (nameLow === 'teguh') { htmlTeguh += cardHTML; countTeguh++; }
                else if (nameLow === 'zalfa' || nameLow === 'dzalfa') { htmlZalfa += cardHTML; countZalfa++; }
                else if (nameLow === 'tester' || nameLow === 'tester3d') { htmlTester += cardHTML; countTester++; }
            });

            const emptyState = `<div class="py-8 border border-dashed border-slate-200 rounded-xl text-center text-slate-400 text-[10px] font-bold uppercase">Kosong</div>`;

            document.getElementById('col-teguh').innerHTML = htmlTeguh || emptyState;
            document.getElementById('col-zalfa').innerHTML = htmlZalfa || emptyState;
            document.getElementById('col-tester3d').innerHTML = htmlTester || emptyState;

            document.getElementById('count-teguh').innerText = countTeguh;
            document.getElementById('count-zalfa').innerText = countZalfa;
            document.getElementById('count-tester3d').innerText = countTester;
        }

        // ==========================================
        // 8. EXPORT EXCEL (.XLSX) DATA DELEGASI TUGAS
        // ==========================================
        function downloadExcel() {
            if (!allKaryawanData || allKaryawanData.length === 0) {
                alert("Belum ada data tugas untuk diunduh.");
                return;
            }

            const rowsForExcel = allKaryawanData.map((k, index) => {
                const parsed = parseProjectInfo(k.project, k);
                const parts = parsePartsData3D(k);
                const fullStart = formatFullDateTime(parsed.tgl || k.startTime, k, parsed);
                const [tglPart, jamPart] = fullStart.includes('•') ? fullStart.split('•').map(s => s.trim()) : [fullStart, parsed.jam || '-'];

                const titleParts = parsed.title.split('-').map(s => s.trim());
                const projectNameClean = titleParts[0] || parsed.title;
                const produkClean = cleanVal(k.namaProduk) || titleParts[1] || '-';

                return {
                    "No": index + 1,
                    "ID Tugas": k.id || '-',
                    "Tanggal Start": tglPart || '-',
                    "Jam Start": jamPart || '-',
                    "PIC Admin": parsed.pic || '-',
                    "Tim 3D": (k.nama || '-').toUpperCase(),
                    "Nama Project": projectNameClean,
                    "Nama Produk": produkClean,
                    "No. WA Client": parsed.wa || '-',
                    "Qty (Pcs)": parsed.qty || '-',
                    "Tipe Pengerjaan": parsed.tipe || '-',
                    "Mesin": k.mesin || 'Auto',
                    "Status": k.status || '-',
                    "Waktu Mesin Jalan": formatFullDateTime(k.waktu, k, parsed),
                    "Nama Parts": parts.namaParts || '-',
                    "Jumlah Parts": parts.jumlahParts || '-',
                    "Warna Parts": parts.warnaParts || '-',
                    "Berat Parts (gr)": parts.beratParts || cleanVal(k.gramasi) || '-',
                    "Waktu Produksi (Menit)": parts.waktuProd || '-',
                    "Jml / Produksi": parts.jmlPerProd || '-',
                    "Catatan Tim": parts.note || '-',
                    "Link Foto Visual": parsed.foto || '-'
                };
            });

            const worksheet = XLSX.utils.json_to_sheet(rowsForExcel);
            const colWidths = Object.keys(rowsForExcel[0]).map(key => ({
                wch: Math.max(key.length + 3, ...rowsForExcel.map(r => String(r[key] || '').length + 2), 12)
            }));
            worksheet['!cols'] = colWidths;

            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Data Delegasi 3D");

            const todayStr = new Date().toISOString().slice(0, 10);
            XLSX.writeFile(workbook, `Data_Delegasi_Tugas_3D_${todayStr}.xlsx`);
        }

        // ==========================================
        // 9. RENDER LOG AKTIVITAS
        // ==========================================
        function setTab(tabName) {
            currentTab = tabName;
            ['Semua', 'teguh', 'zalfa', 'tester'].forEach(name => {
                const btn = document.getElementById(`tab-${name}`);
                if(btn) {
                    btn.className = name === tabName
                        ? "text-brand-600 border-b-2 border-brand-600 pb-0.5"
                        : "text-slate-400 border-b-2 border-transparent pb-0.5 hover:text-slate-700";
                }
            });
            renderLogs();
        }

        function renderLogs() {
            const container = document.getElementById('log-container');
            const filtered = currentTab === 'Semua' ? allLogs : allLogs.filter(log => {
                const n = (log.nama || '').toLowerCase();
                if(currentTab === 'zalfa') return n === 'zalfa' || n === 'dzalfa';
                if(currentTab === 'tester') return n === 'tester' || n === 'tester3d';
                return n === currentTab;
            });

            if(filtered.length === 0) {
                container.innerHTML = `<tr><td class="p-6 text-center text-[11px] font-semibold text-slate-400">Belum ada riwayat aktivitas.</td></tr>`;
                return;
            }

            container.innerHTML = filtered.map(log => `
                <tr class="hover:bg-slate-50">
                    <td class="px-4 py-2.5 w-36 text-[10px] font-bold text-slate-400 whitespace-nowrap">${log.waktu}</td>
                    <td class="px-4 py-2.5 w-24 text-[10px] font-extrabold text-slate-700 uppercase">${log.nama}</td>
                    <td class="px-4 py-2.5 text-xs font-medium text-slate-600">${log.aktivitas}</td>
                </tr>
            `).join('');
        }
    </script>
</body>
