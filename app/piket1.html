<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Piket & Kas - Molusca</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- Font Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style> 
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            -webkit-user-select: none; user-select: none; 
            -webkit-font-smoothing: antialiased;
        } 
        
        /* Shimmer Skeleton Loading */
        .skeleton {
            background: linear-gradient(110deg, #f1f5f9 8%, #e2e8f0 18%, #f1f5f9 33%);
            border-radius: 8px;
            background-size: 200% 100%;
            animation: 1.5s shine linear infinite;
        }
        @keyframes shine { to { background-position-x: -200%; } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade { animation: fadeIn 0.3s ease-out forwards; }
    </style>
</head>
<body class="bg-[#F8FAFC] pb-24 text-slate-800" onload="initApp()" oncontextmenu="return false;">

    <!-- ============================================== -->
    <!-- HEADER -->
    <!-- ============================================== -->
    <header class="bg-white/80 backdrop-blur-xl sticky top-0 z-50 py-4 px-4 md:px-6 border-b border-slate-200 flex justify-between items-center shadow-sm">
        <div class="max-w-[800px] mx-auto w-full flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-blue-50 text-blue-600 w-10 h-10 md:w-12 md:h-12 rounded-xl flex items-center justify-center border border-blue-100 shadow-sm">
                    <i class="ph-fill ph-broom text-xl md:text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-sm md:text-[17px] font-extrabold tracking-tight text-slate-900 leading-none flex items-center gap-2">
                        Piket & Kas <span id="syncIndicator" class="text-[10px] font-bold text-slate-400 bg-slate-100 px-2 py-0.5 rounded-md flex items-center gap-1"><i class="ph-bold ph-arrows-clockwise animate-spin text-blue-500"></i> Syncing...</span>
                    </h1>
                    <span class="text-[9px] md:text-[10px] font-bold text-slate-500 uppercase tracking-widest mt-1 block" id="userInfoHeader">Workspace Tim</span>
                </div>
            </div>
            <button onclick="goBack()" class="text-[10px] md:text-[11px] font-extrabold text-slate-500 bg-white border border-slate-200 px-3 md:px-4 py-2.5 md:py-3 rounded-xl uppercase flex items-center gap-1.5 hover:bg-slate-50 hover:text-slate-800 transition tracking-widest shadow-sm">
                <i class="ph-bold ph-arrow-left text-sm md:text-lg"></i> <span class="hidden sm:inline">KEMBALI</span>
            </button>
        </div>
    </header>

    <main class="p-4 md:p-8 max-w-[800px] mx-auto space-y-8 md:space-y-10 mt-2">
        
        <!-- ============================================== -->
        <!-- SECTION PIKET -->
        <!-- ============================================== -->
        <section class="animate-fade">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-end gap-2 mb-4 md:mb-5 ml-1">
                <h2 class="text-[13px] md:text-[15px] font-extrabold text-slate-800 uppercase tracking-widest flex items-center gap-2">
                    <i class="ph-fill ph-calendar-check text-blue-500 text-xl md:text-2xl"></i> Jadwal Hari Ini
                </h2>
                <div id="tanggalHariIni" class="text-[10px] md:text-[11px] font-bold text-slate-500 bg-white border border-slate-200 px-3 py-1.5 rounded-lg shadow-sm flex items-center gap-1.5">
                    <i class="ph-bold ph-calendar-blank"></i> --
                </div>
            </div>
            <div id="piket-list" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <!-- Skeleton Loader Piket -->
                <div class="bg-white p-5 md:p-6 rounded-[24px] border border-slate-200 shadow-sm flex justify-between items-center"><div class="skeleton h-6 w-32"></div><div class="skeleton h-8 w-24 rounded-xl"></div></div>
            </div>
        </section>

        <!-- ============================================== -->
        <!-- SECTION DENDA -->
        <!-- ============================================== -->
        <section class="pt-4 md:pt-6 border-t border-slate-200 animate-fade" style="animation-delay: 0.1s;">
            <div class="flex justify-between items-center mb-4 ml-1">
                <h2 class="text-[11px] md:text-[12px] font-black text-slate-400 uppercase tracking-[0.2em] flex items-center gap-2">
                    <i class="ph-fill ph-warning-circle text-lg md:text-xl text-rose-500"></i> Nunggak Denda Piket
                </h2>
            </div>
            <div id="denda-list" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div class="col-span-full text-center p-6 bg-white rounded-[24px] border border-slate-200"><div class="skeleton h-4 w-48 mx-auto"></div></div>
            </div>
        </section>

        <!-- ============================================== -->
        <!-- SECTION FORM KASBON -->
        <!-- ============================================== -->
        <section class="bg-slate-900 p-6 md:p-8 rounded-[32px] shadow-xl shadow-slate-900/10 text-white relative overflow-hidden animate-fade" style="animation-delay: 0.2s;">
            <i class="ph-fill ph-hand-coins absolute -right-6 -bottom-6 text-9xl md:text-[150px] opacity-5 pointer-events-none"></i>
            <div class="relative z-10">
                <h2 class="text-[12px] md:text-[13px] font-extrabold uppercase tracking-widest mb-6 flex items-center gap-2 text-white">
                    <i class="ph-fill ph-money text-amber-500 text-xl md:text-2xl"></i> Form Pengajuan Kasbon
                </h2>
                <form id="formKasbon" onsubmit="ajukanKasbon(event)" class="space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="relative">
                            <i class="ph-bold ph-user absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-[16px]"></i>
                            <select id="kbUser" required class="w-full bg-white/10 border border-white/10 rounded-2xl py-3.5 pl-11 pr-4 text-white text-[13px] font-bold outline-none appearance-none cursor-pointer focus:ring-2 focus:ring-amber-500/50 transition-all">
                                <option value="" disabled selected class="text-slate-900">Pilih Nama Pemohon...</option>
                            </select>
                            <i class="ph-bold ph-caret-down absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"></i>
                        </div>
                        <div class="relative">
                            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-[12px] font-bold">Rp</span>
                            <input type="number" id="kbAmount" required placeholder="Cth: 50000" class="w-full bg-white/10 border border-white/10 rounded-2xl py-3.5 pl-11 pr-4 text-white text-[13px] font-bold outline-none focus:ring-2 focus:ring-amber-500/50 transition-all placeholder-white/30">
                        </div>
                    </div>
                    <div class="relative">
                        <i class="ph-bold ph-text-align-left absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-[16px]"></i>
                        <input type="text" id="kbReason" required placeholder="Keperluan kasbon..." autocomplete="off" class="w-full bg-white/10 border border-white/10 rounded-2xl py-3.5 pl-11 pr-4 text-white text-[13px] font-bold outline-none focus:ring-2 focus:ring-amber-500/50 transition-all placeholder-white/30">
                    </div>
                    <button type="submit" id="btnSubmitKasbon" class="w-full bg-amber-500 hover:bg-amber-600 active:scale-[0.98] text-white font-extrabold py-3.5 rounded-2xl transition-all uppercase tracking-widest text-[11px] md:text-[12px] flex justify-center items-center gap-2 shadow-sm mt-2">
                        <i class="ph-bold ph-paper-plane-right text-[16px]"></i> Ajukan Kasbon
                    </button>
                </form>
            </div>
        </section>

        <!-- ============================================== -->
        <!-- SECTION RIWAYAT KASBON -->
        <!-- ============================================== -->
        <section class="pt-4 md:pt-6 animate-fade" style="animation-delay: 0.3s;">
            <h2 class="text-[11px] md:text-[12px] font-black text-slate-400 uppercase tracking-[0.2em] mb-4 ml-1 flex items-center gap-2">
                <i class="ph-fill ph-receipt text-lg md:text-xl"></i> Riwayat Kasbon Tim
            </h2>
            <div id="kasbon-list" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                 <!-- Skeleton Loader Kasbon -->
                <div class="bg-white p-6 rounded-[24px] border border-slate-200"><div class="skeleton h-4 w-1/3 mb-2"></div><div class="skeleton h-8 w-1/2 mb-3"></div><div class="skeleton h-12 w-full rounded-xl"></div></div>
            </div>
        </section>
    </main>

    <script>
        // Mencegah Inspect Element dll
        document.addEventListener('keydown', function(e) { if (e.ctrlKey && ['c','u','s','p','a'].includes(e.key.toLowerCase())) e.preventDefault(); });

        // ==========================================
        // KONFIGURASI API
        // ==========================================
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxowuOA-SAq4m4a5sGRljiP8vp7yPkO5QunSGH8WBOJyKiQyGbp_FyY7A6pNGfY6y0rBg/exec";
        const SPREADSHEET_ID = '1d3njy330ifMnm-uBD8daaey5AqYO3rQxaI-tLZQdeyI'; // ID Sheet Kamu

        const userRole = localStorage.getItem('moluscaRole');
        const userName = localStorage.getItem('moluscaUser');

        function goBack() {
            if (userRole === 'admin') window.location.href = 'dashboard.html';
            else if (userRole === 'konten' || userRole === 'konten kreator') window.location.href = 'konten.html';
            else window.location.href = 'desainer.html';
        }

        // ==========================================
        // KONFIGURASI JADWAL PIKET
        // ==========================================
        const jadwalPiket = { 
            1: ['Opik'],              // Senin
            2: ['Indah', 'Elfrida'],  // Selasa
            3: ['nayla'],             // Rabu
            4: ['nazma'],             // Kamis
            5: ['Esa'],               // Jumat
            6: ['Dadan'],             // Sabtu
            0: []                     // Minggu (Libur)
        };
        
        function getFormattedDate(dateObj) {
            let dd = String(dateObj.getDate()).padStart(2, '0');
            let mm = String(dateObj.getMonth() + 1).padStart(2, '0');
            let yyyy = dateObj.getFullYear();
            return `${dd}-${mm}-${yyyy}`;
        }

        const todayDate = new Date();
        const todayStr = getFormattedDate(todayDate);
        const dayIndex = todayDate.getDay();
        let globalPiketData = [];
        let listTim = []; 

        // --- FUNGSI TULIS DATA (SLOW BACKGROUND) ---
        async function dbCall(payload) {
            try {
                const res = await fetch(SCRIPT_URL, { 
                    method: 'POST', redirect: 'follow', 
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload) 
                });
                return await res.json();
            } catch (error) {
                console.error("Database Error:", error);
                return { status: 'error' };
            }
        }

        // --- FUNGSI BACA DATA CEPAT (GVIZ API) ---
        async function fetchSheetFast(sheetName) {
            const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json&sheet=${sheetName}`;
            try {
                const response = await fetch(url);
                const text = await response.text();
                const jsonStr = text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1);
                const data = JSON.parse(jsonStr);
                
                const cols = data.table.cols.map(c => c ? c.label : '').map(l => l.trim());
                return data.table.rows.map(r => {
                    let row = {};
                    r.c.forEach((c, i) => { if(cols[i]) row[cols[i]] = c ? (c.f !== undefined ? c.f : c.v) : ''; });
                    return row;
                });
            } catch(e) {
                console.error(`Gagal muat sheet ${sheetName}:`, e);
                return [];
            }
        }

        function formatRupiah(angka) { 
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka || 0); 
        }

        // ==========================================
        // INIT APP & LOAD DATA SUPER CEPAT
        // ==========================================
        async function initApp() {
            if (!userName) window.location.href = 'index.html';

            document.getElementById('userInfoHeader').innerText = `Login sbg: ${userName} (${userRole})`;
            document.getElementById('tanggalHariIni').innerHTML = `<i class="ph-bold ph-calendar-blank"></i> ${todayDate.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })}`;
            
            await loadAllDataFast();
        }

        async function loadAllDataFast() {
            const syncInd = document.getElementById('syncIndicator');
            syncInd.innerHTML = '<i class="ph-bold ph-arrows-clockwise animate-spin text-blue-500"></i> Syncing...';

            try {
                // Tarik semua data secara PARALEL (Bersamaan)
                const [resPiket, resKasbon, resUsers] = await Promise.all([
                    fetchSheetFast('piket_log'),
                    fetchSheetFast('kasbon'),
                    fetchSheetFast('users')
                ]);

                // 1. Setup Dropdown Users
                if (resUsers && resUsers.length > 0) {
                    listTim = resUsers.filter(u => u.role !== 'admin' && u.name).map(u => u.name);
                    const selectUser = document.getElementById('kbUser');
                    selectUser.innerHTML = '<option value="" disabled selected class="text-slate-900">Pilih Nama Pemohon...</option>';
                    listTim.forEach(nama => {
                        let isSelected = (nama === userName && userRole !== 'admin') ? 'selected' : '';
                        selectUser.innerHTML += `<option value="${nama}" class="text-slate-900" ${isSelected}>${nama}</option>`;
                    });
                    if(userRole !== 'admin') {
                        selectUser.disabled = true;
                        selectUser.classList.add('opacity-80', 'cursor-not-allowed', 'bg-white/5');
                    }
                }

                // 2. Set Global Piket Data
                globalPiketData = resPiket || [];

                // 3. Sync Piket Automatis (Mengecek siapa yang nunggak)
                await syncPiketData();

                // 4. Render UI
                renderPiket();
                renderDenda();
                renderKasbon(resKasbon || []);

                syncInd.innerHTML = '<i class="ph-bold ph-check text-emerald-500"></i> Synced';
                setTimeout(() => { syncInd.innerHTML = ''; }, 2000);

            } catch (error) {
                console.error("Gagal load data", error);
                syncInd.innerHTML = '<i class="ph-bold ph-warning text-rose-500"></i> Error';
            }
        }

        // ==============================================================
        // SINKRONISASI PIKET OTOMATIS (Cek 3 Hari ke Belakang)
        // ==============================================================
        async function syncPiketData() {
            let needsRefresh = false;

            // Cek jadwal hari ini & 3 hari ke belakang
            for(let i = 0; i <= 3; i++) {
                let checkDate = new Date();
                checkDate.setDate(checkDate.getDate() - i);
                
                let checkDateStr = getFormattedDate(checkDate);
                let checkDayIndex = checkDate.getDay();
                let petugas = jadwalPiket[checkDayIndex] || [];
                
                if (petugas.length === 0) continue; // Skip hari libur

                for (let name of petugas) {
                    let expectedId = `${checkDateStr}_${name}`;
                    let logExists = globalPiketData.find(log => log.id === expectedId);

                    // Jika log absen belum ada sama sekali
                    if (!logExists) {
                        let setStatus = (i === 0) ? 'belum' : 'denda_belum'; // Hari ini 'belum', Kemarin langsung 'denda_belum'
                        
                        // Lakukan insert via Apps Script di background
                        await dbCall({
                            action: 'insert', sheetName: 'piket_log',
                            data: { id: expectedId, dateStr: checkDateStr, name: name, status: setStatus }
                        });
                        needsRefresh = true;
                    } 
                    // Jika log ada, tapi statusnya masih 'belum' dan ini adalah jadwal kemarin (i > 0)
                    else if (i > 0 && logExists.status === 'belum') {
                        await dbCall({ 
                            action: 'update', sheetName: 'piket_log', 
                            idValue: expectedId, 
                            updateData: { status: 'denda_belum' } 
                        });
                        needsRefresh = true;
                    }
                }
            }

            // Jika ada perubahan pada database (denda baru tercatat), ambil ulang data piket
            if(needsRefresh) {
                globalPiketData = await fetchSheetFast('piket_log');
            }
        }

        // ==========================================
        // FUNGSI AKSI (KLIK TOMBOL)
        // ==========================================
        async function absenPiket(namaYangPiket, btnId) {
            if(confirm(`Yakin ${namaYangPiket} sudah menyapu dan merapikan studio?`)) {
                const btn = document.getElementById(btnId);
                btn.innerHTML = '<i class="ph-bold ph-spinner animate-spin text-[16px]"></i> Memproses...';
                btn.disabled = true;
                
                await dbCall({ 
                    action: 'update', sheetName: 'piket_log', 
                    idValue: `${todayStr}_${namaYangPiket}`, 
                    updateData: { status: 'sudah' } 
                });
                
                loadAllDataFast(); 
            }
        }

        async function updateDendaAdmin(idDB, actionType, btnElement) {
            let newStatus = actionType === 'lunas' ? 'denda_lunas' : 'bebas_denda';
            let msg = actionType === 'lunas' ? 'menandai denda ini LUNAS' : 'MEMBEBASKAN denda ini';
            
            if(!confirm(`Apakah Anda yakin ingin ${msg}?`)) return;

            const origHtml = btnElement.innerHTML;
            btnElement.innerHTML = '<i class="ph-bold ph-spinner animate-spin"></i>';
            btnElement.disabled = true;

            await dbCall({
                action: 'update', sheetName: 'piket_log',
                idValue: idDB,
                updateData: { status: newStatus }
            });
            
            loadAllDataFast();
        }

        async function ajukanKasbon(e) {
            e.preventDefault();
            const btn = document.getElementById('btnSubmitKasbon');
            const origHtml = btn.innerHTML;
            btn.innerHTML = '<i class="ph-bold ph-spinner animate-spin text-[16px]"></i> Mengirim...'; 
            btn.disabled = true;

            const id = Date.now().toString();
            const namaPemohon = document.getElementById('kbUser').value; 

            if(!namaPemohon) {
                alert("Harap pilih nama pemohon terlebih dahulu!");
                btn.innerHTML = origHtml; 
                btn.disabled = false;
                return;
            }
            
            await dbCall({
                action: 'insert', sheetName: 'kasbon',
                data: {
                    id: id, name: namaPemohon, amount: parseInt(document.getElementById('kbAmount').value),
                    reason: document.getElementById('kbReason').value, dateStr: todayStr, status: 'Menunggu'
                }
            });

            document.getElementById('kbAmount').value = '';
            document.getElementById('kbReason').value = '';
            btn.innerHTML = origHtml; 
            btn.disabled = false;
            
            loadAllDataFast(); // Refresh list riwayat kasbon
        }

        // ==========================================
        // RENDER UI
        // ==========================================
        function renderPiket() {
            const list = document.getElementById('piket-list');
            list.innerHTML = '';
            const petugas = jadwalPiket[dayIndex] || [];
            
            if (petugas.length === 0) { 
                list.innerHTML = `<div class="col-span-full text-center p-6 bg-white shadow-sm text-slate-500 font-bold text-[13px] rounded-[24px] border border-slate-200 flex flex-col items-center justify-center gap-2"><i class="ph-fill ph-coffee text-3xl text-slate-300"></i> Hari ini libur piket studio.</div>`; 
                return; 
            }

            const todayLogs = globalPiketData.filter(d => d.id && d.id.startsWith(todayStr));

            petugas.forEach((name, index) => {
                let log = todayLogs.find(d => d.name === name);
                let status = log ? log.status : 'belum';
                let ui = '';
                let btnId = `btn-absen-${index}`;
                let isMyTurn = (userName === name || userRole === 'admin');

                if (status === 'sudah') {
                    ui = `<span class="bg-emerald-50 text-emerald-600 px-3.5 py-2.5 rounded-xl text-[10px] font-extrabold uppercase tracking-widest border border-emerald-200 flex items-center gap-1.5"><i class="ph-bold ph-check-circle text-[14px]"></i> Selesai Piket</span>`;
                } else if (status === 'denda_belum') {
                    ui = `<span class="bg-rose-50 text-rose-600 px-3.5 py-2.5 rounded-xl text-[10px] font-extrabold uppercase tracking-widest border border-rose-200 flex items-center gap-1.5"><i class="ph-bold ph-warning-circle text-[14px]"></i> Kena Denda</span>`;
                } else if (status === 'denda_lunas' || status === 'denda') {
                    ui = `<span class="bg-amber-50 text-amber-600 px-3.5 py-2.5 rounded-xl text-[10px] font-extrabold uppercase tracking-widest border border-amber-200 flex items-center gap-1.5"><i class="ph-bold ph-money text-[14px]"></i> Denda Lunas</span>`;
                } else {
                    if (isMyTurn) {
                        ui = `<button id="${btnId}" onclick="absenPiket('${name}', '${btnId}')" class="bg-blue-600 hover:bg-blue-700 active:scale-[0.98] text-white px-5 py-2.5 rounded-xl text-[11px] font-extrabold uppercase tracking-wider shadow-sm transition-all flex gap-1.5 items-center"><i class="ph-bold ph-hand-pointing text-[14px]"></i> Klik Absen</button>`;
                    } else {
                        ui = `<span class="bg-slate-100 text-slate-500 px-3.5 py-2.5 rounded-xl text-[10px] font-extrabold uppercase tracking-widest border border-slate-200 flex items-center gap-1.5"><i class="ph-bold ph-hourglass-high text-[14px]"></i> Belum Absen</span>`;
                    }
                }

                list.innerHTML += `
                <div class="bg-white p-5 rounded-[24px] border border-slate-200 shadow-sm flex justify-between items-center hover:border-blue-300 transition-colors">
                    <h4 class="font-extrabold text-slate-800 text-[14px] md:text-[15px] flex items-center gap-2"><i class="ph-fill ph-user-circle text-blue-500 text-[28px]"></i> ${name}</h4>
                    ${ui}
                </div>`;
            });
        }

        function renderDenda() {
            const list = document.getElementById('denda-list');
            list.innerHTML = '';
            
            const nunggakList = globalPiketData.filter(d => 
                d.status === 'denda_belum' || (d.status === 'belum' && d.id && !d.id.startsWith(todayStr))
            );

            if (nunggakList.length === 0) {
                list.innerHTML = `<div class="col-span-full text-center p-6 bg-white shadow-sm text-emerald-500 font-bold text-[12px] rounded-[24px] border border-emerald-100 flex items-center justify-center gap-2"><i class="ph-fill ph-check-circle text-2xl"></i> Aman! Tidak ada tim yang nunggak denda.</div>`;
                return;
            }

            nunggakList.forEach(item => {
                let adminControls = '';
                if (userRole === 'admin') {
                    adminControls = `
                    <div class="flex gap-2 mt-3">
                        <button onclick="updateDendaAdmin('${item.id}', 'lunas', this)" class="bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-white px-3 py-1.5 rounded-lg text-[9px] font-extrabold uppercase tracking-widest shadow-sm transition-all flex items-center gap-1"><i class="ph-bold ph-check"></i> Tandai Lunas</button>
                        <button onclick="updateDendaAdmin('${item.id}', 'bebas', this)" class="bg-slate-100 hover:bg-slate-200 border border-slate-200 text-slate-600 px-3 py-1.5 rounded-lg text-[9px] font-extrabold uppercase tracking-widest shadow-sm transition-all">Batal</button>
                    </div>`;
                }

                let tglBolos = item.id.split('_')[0] || item.dateStr;

                list.innerHTML += `
                    <div class="bg-white p-5 rounded-[24px] border-2 border-rose-100 shadow-sm flex justify-between items-start hover:border-rose-300 transition-colors">
                        <div>
                            <h4 class="font-extrabold text-slate-800 text-[14px] flex items-center gap-1.5"><i class="ph-fill ph-warning-circle text-rose-500 text-[20px]"></i> ${item.name}</h4>
                            <div class="text-[10px] font-bold text-rose-500 bg-rose-50 px-2 py-0.5 rounded border border-rose-100 mt-2 uppercase tracking-widest inline-flex items-center gap-1"><i class="ph-bold ph-calendar-blank"></i> Bolos: ${tglBolos}</div>
                            ${adminControls}
                        </div>
                        <span class="bg-rose-500 text-white px-3 py-2 rounded-xl text-[10px] font-black uppercase shadow-sm flex items-center gap-1 mt-1">Utang 5k</span>
                    </div>
                `;
            });
        }

        function renderKasbon(data) {
            const list = document.getElementById('kasbon-list');
            list.innerHTML = '';
            
            if(!Array.isArray(data) || data.length === 0) { 
                list.innerHTML = `<div class="col-span-full text-center p-6 bg-white rounded-[24px] text-slate-400 font-bold text-[12px] border border-slate-200 shadow-sm flex items-center justify-center gap-2"><i class="ph-fill ph-receipt text-2xl opacity-50"></i> Belum ada riwayat pengajuan kasbon.</div>`; 
                return; 
            }

            [...data].reverse().forEach(item => {
                if (!item.id || !item.name) return;

                let badge = item.status === 'Menunggu' ? `<span class="bg-amber-50 text-amber-600 px-2.5 py-1 rounded-lg text-[9px] font-extrabold uppercase tracking-widest border border-amber-200 shadow-sm"><i class="ph-bold ph-hourglass-high"></i> Menunggu ACC</span>` : `<span class="bg-blue-50 text-blue-600 px-2.5 py-1 rounded-lg text-[9px] font-extrabold uppercase tracking-widest border border-blue-200 shadow-sm"><i class="ph-bold ph-check-circle"></i> Disetujui</span>`;
                
                list.innerHTML += `
                <div class="bg-white p-5 rounded-[24px] border border-slate-200 shadow-sm hover:border-blue-300 transition-colors">
                    <div class="flex justify-between items-start mb-3">
                        <div>
                            <h4 class="font-extrabold text-slate-800 text-[14px] mb-1.5">${item.name}</h4>
                            <div class="text-[9px] font-bold text-slate-500 uppercase tracking-widest bg-slate-100 inline-flex items-center gap-1 px-2 py-0.5 rounded border border-slate-200"><i class="ph-bold ph-calendar-blank"></i> ${item.dateStr}</div>
                        </div>
                        ${badge}
                    </div>
                    <div class="text-[22px] md:text-[26px] font-black text-slate-800 tracking-tight mb-2.5">${formatRupiah(item.amount)}</div>
                    <div class="text-[11px] text-slate-600 bg-slate-50 px-3 py-2.5 rounded-xl italic border border-slate-200 font-medium leading-relaxed">"${item.reason}"</div>
                </div>`;
            });
        }
    </script>
</body>
</html>
