<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Dakreativ Stride</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

    <style>
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        html, body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #090a0f;
            color: #ffffff;
            height: 100dvh;
            width: 100vw;
            overflow: hidden;
            user-select: none;
        }
        .font-mono-num { font-family: 'JetBrains Mono', monospace; }
        .leaflet-control-attribution, .leaflet-control-zoom { display: none !important; }
        .leaflet-container { background-color: #090a0f !important; width: 100%; height: 100%; }

        /* Surface Flat & Clean */
        .surface-panel {
            background: rgba(12, 14, 20, 0.94);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* GPS Dot Minimalis */
        @keyframes pulseRing {
            0% { transform: scale(0.8); opacity: 0.8; }
            100% { transform: scale(2.4); opacity: 0; }
        }
        .gps-marker-wrap {
            position: relative;
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .gps-marker-ring {
            position: absolute;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: rgba(56, 189, 248, 0.4);
            animation: pulseRing 2s cubic-bezier(0, 0, 0.2, 1) infinite;
        }
        .gps-marker-dot {
            position: relative;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #38bdf8;
            border: 2px solid #ffffff;
        }
    </style>
</head>
<body class="relative flex flex-col justify-between">

    <div id="map" class="fixed inset-0 z-0"></div>

    <!-- 3. BOTTOM PANEL -->
    <main class="relative z-10 w-full max-w-md mx-auto px-4 pb-4 flex flex-col gap-2">
        
        <!-- Baris Indikator GPS & Recenter -->

            <button onclick="locateUserNow(true)" class="w-9 h-9 surface-panel rounded-md flex items-center justify-center text-neutral-200 active:bg-white/10 transition-colors" title="Fokus Lokasi">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="3"/>
                    <path stroke-linecap="round" d="M12 2v3m0 14v3M2 12h3m14 0h3"/>
                </svg>
            </button>
        </div>

        <!-- Kartu Statistik Utama -->
        <div class="surface-panel rounded-xl p-4">
            <!-- Jarak Utama -->
            <div class="flex items-baseline justify-between mb-3">
                <div class="flex items-baseline gap-2">
                    <span id="distanceDisplay" class="text-5xl font-extrabold tracking-tight font-mono-num text-white">0.00</span>
                    <span class="text-xs font-mono-num font-bold text-sky-400 uppercase">KM</span>
                </div>
                <span id="activityState" class="text-[10px] font-mono-num font-bold uppercase tracking-widest text-neutral-400">READY</span>

            <!-- Grid Metrik -->
            <div class="grid grid-cols-3 border-y border-white/10 py-3 mb-4">

            <!-- Tombol Utama -->

    <!-- 4. MODAL HASIL & SCREENSHOT 1080x1920 -->

            <div class="flex items-center justify-between">

    <!-- 5. MODAL PROFIL -->
    <div id="profileModal" class="hidden fixed inset-0 z-50 bg-black/85 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="surface-panel rounded-xl p-5 w-full max-w-sm">
            <h3 class="text-xs font-mono-num font-bold text-neutral-300 uppercase tracking-wider mb-4">Pengaturan Profil</h3>
            <div class="space-y-3">
                <div>
                    <label class="text-[11px] text-neutral-400 font-medium block mb-1">Nama</label>
                    <input id="inputName" type="text" class="w-full bg-black border border-white/15 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-sky-400">
                </div>
                <div>
                    <label class="text-[11px] text-neutral-400 font-medium block mb-1">Hari Ke-</label>
                    <input id="inputDay" type="number" min="1" class="w-full bg-black border border-white/15 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-sky-400">
                </div>
                <div>
                    <label class="text-[11px] text-neutral-400 font-medium block mb-1">Foto Profil</label>
                    <input id="inputAvatarFile" type="file" accept="image/*" class="w-full text-xs text-neutral-400 file:mr-3 file:py-1.5 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-bold file:bg-white file:text-black cursor-pointer">
                </div>
            </div>
            <div class="flex gap-2 mt-5">
                <button onclick="closeProfileModal()" class="w-1/2 bg-white/10 py-2.5 rounded-lg text-xs font-bold text-neutral-300">Batal</button>
                <button onclick="saveProfile()" class="w-1/2 bg-white py-2.5 rounded-lg text-xs font-extrabold text-neutral-950">Simpan</button>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // =====================================================
        // 1. STATE & PROFIL
        // =====================================================
        let currentCity = "Bandung, Indonesia";
        let currentDayNumber = parseInt(localStorage.getItem('stride_day_count') || '1', 10);

        const userNameEl = document.getElementById('userName');
        const userAvatarEl = document.getElementById('userAvatar');
        const dayBadgeEl = document.getElementById('dayBadge');
        const locationNameEl = document.getElementById('locationName');
        const gpsIndicator = document.getElementById('gpsIndicator');
        const gpsStatusText = document.getElementById('gpsStatusText');

        function formatDayBadge(num) {
            return `DAY ${String(num).padStart(2, '0')}`;
        }

        function initProfile() {
            const savedName = localStorage.getItem('stride_name');
            const savedAvatar = localStorage.getItem('stride_avatar');
            if (savedName) userNameEl.innerText = savedName;
            if (savedAvatar) userAvatarEl.src = savedAvatar;
            dayBadgeEl.innerText = formatDayBadge(currentDayNumber);

            fetch('simpan_data.php?action=stats')
                .then(r => r.json())
                .then(res => {
                    if (res && res.total_days) {
                        currentDayNumber = res.total_days;
                        localStorage.setItem('stride_day_count', currentDayNumber);
                        dayBadgeEl.innerText = formatDayBadge(currentDayNumber);
                    }
                }).catch(() => {});
        }
        initProfile();

        function openProfileModal() {
            document.getElementById('inputName').value = userNameEl.innerText;
            document.getElementById('inputDay').value = currentDayNumber;
            document.getElementById('profileModal').classList.remove('hidden');
        }
        function closeProfileModal() {
            document.getElementById('profileModal').classList.add('hidden');
        }
        function saveProfile() {
            const newName = document.getElementById('inputName').value.trim();
            const newDay = parseInt(document.getElementById('inputDay').value, 10);
            const fileInput = document.getElementById('inputAvatarFile');

            if (newName) {
                userNameEl.innerText = newName;
                localStorage.setItem('stride_name', newName);
            }
            if (newDay > 0) {
                currentDayNumber = newDay;
                localStorage.setItem('stride_day_count', currentDayNumber);
                dayBadgeEl.innerText = formatDayBadge(currentDayNumber);
            }
            if (fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    userAvatarEl.src = e.target.result;
                    localStorage.setItem('stride_avatar', e.target.result);
                };
                reader.readAsDataURL(fileInput.files[0]);
            }
            closeProfileModal();
        }

        // =====================================================
        // 2. INISIALISASI MAP (CARTODB DARK MATTER - STABIL DI ZOOM TINGGI)
        // =====================================================
        const map = L.map('map', {
            zoomControl: false,
            attributionControl: false
        }).setView([-6.9175, 107.6191], 16);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            subdomains: 'abcd',
            maxNativeZoom: 19,
            maxZoom: 20
        }).addTo(map);

        // Pastikan ukuran map pas di layar mobile
        window.addEventListener('load', () => {
            setTimeout(() => map.invalidateSize(), 150);
        });
        window.addEventListener('resize', () => map.invalidateSize());

        let routePolyline = L.polyline([], {
            color: '#38bdf8',
            weight: 4,
            opacity: 1,
            lineCap: 'round',
            lineJoin: 'round'
        }).addTo(map);

        let userMarker = null, startMarker = null;
        let lastKnownLat = null, lastKnownLng = null;
        let hasInitialCenter = false;
        let lastGeocodeTime = 0;

        const gpsIcon = L.divIcon({
            className: '',
            html: `<div class="gps-marker-wrap"><div class="gps-marker-ring"></div><div class="gps-marker-dot"></div></div>`,
            iconSize: [18, 18],
            iconAnchor: [9, 9]
        });

        async function fetchLocationName(lat, lng) {
            const now = Date.now();
            if (now - lastGeocodeTime < 15000) return; // Batasi request agar tidak terkena limit
            lastGeocodeTime = now;

            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=14`);
                const data = await res.json();
                if (data && data.address) {
                    const addr = data.address;
                    const area = addr.suburb || addr.village || addr.neighbourhood || addr.town || addr.city_district || '';
                    const city = addr.city || addr.county || addr.state || 'Indonesia';
                    currentCity = area ? `${area}, ${city}` : city;
                    locationNameEl.innerText = currentCity;
                }
            } catch (e) {
                currentCity = `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
                locationNameEl.innerText = currentCity;
            }
        }

        function updateMarkerPosition(lat, lng, accuracy, centerMap = false) {
            lastKnownLat = lat;
            lastKnownLng = lng;

            if (!userMarker) {
                userMarker = L.marker([lat, lng], { icon: gpsIcon }).addTo(map);
            } else {
                userMarker.setLatLng([lat, lng]);
            }

            if (centerMap) {
                map.invalidateSize();
                map.setView([lat, lng], 17, { animate: true });
            }

            gpsIndicator.className = "w-2 h-2 rounded-full bg-emerald-400";
            gpsStatusText.innerText = `GPS ±${Math.round(accuracy)}m`;
            fetchLocationName(lat, lng);
        }

        function locateUserNow(forceZoom = true) {
            if (!navigator.geolocation) {
                gpsStatusText.innerText = "NO GPS";
                return;
            }
            if (forceZoom && lastKnownLat && lastKnownLng) {
                map.setView([lastKnownLat, lastKnownLng], 17, { animate: true });
            }
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    updateMarkerPosition(pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy, forceZoom);
                    hasInitialCenter = true;
                },
                () => {
                    gpsIndicator.className = "w-2 h-2 rounded-full bg-rose-500";
                    gpsStatusText.innerText = "GPS OFF";
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }

        // Jalankan pemantauan lokasi sejak aplikasi dibuka
        locateUserNow(true);
        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(
                (pos) => {
                    const shouldCenter = !hasInitialCenter;
                    hasInitialCenter = true;
                    updateMarkerPosition(pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy, shouldCenter);
                    if (isTracking) {
                        recordCoordinate(pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy);
                    }
                },
                () => {},
                { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
            );
        }

        // =====================================================
        // 3. LOGIKA TRACKING
        // =====================================================
        let isTracking = false, timerInterval = null, startTime = null;
        let totalDistance = 0, totalSeconds = 0, routeCoordinates = [];
        let dbData = {};

        const btnAction = document.getElementById('btnAction');
        const btnSim = document.getElementById('btnSim');
        const activityState = document.getElementById('activityState');
        const distanceDisplay = document.getElementById('distanceDisplay');
        const timerDisplay = document.getElementById('timerDisplay');
        const paceDisplay = document.getElementById('paceDisplay');
        const calDisplay = document.getElementById('calDisplay');

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon / 2) * Math.sin(dLon / 2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        function formatMySQLDate(date) {
            const pad = (n) => String(n).padStart(2, '0');
            return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())} ${pad(date.getHours())}:${pad(date.getMinutes())}:${pad(date.getSeconds())}`;
        }

        function recordCoordinate(lat, lng, accuracy = 10) {
            if (accuracy > 45 && routeCoordinates.length > 0) return;

            const latlng = [lat, lng];
            if (routeCoordinates.length === 0) {
                startMarker = L.circleMarker(latlng, {
                    radius: 5,
                    fillColor: '#090a0f',
                    color: '#ffffff',
                    weight: 2.5,
                    fillOpacity: 1
                }).addTo(map);
            } else {
                const prev = routeCoordinates[routeCoordinates.length - 1];
                const stepKm = calculateDistance(prev[0], prev[1], lat, lng);
                if (stepKm < 0.002) return;
                totalDistance += stepKm;
                distanceDisplay.innerText = totalDistance.toFixed(2);
                calDisplay.innerText = Math.max(1, Math.round(totalDistance * 65));
            }

            routeCoordinates.push(latlng);
            routePolyline.setLatLngs(routeCoordinates);
            map.panTo(latlng, { animate: true });
        }

        function simulateStep() {
            if (!isTracking) return;
            const baseLat = lastKnownLat || -6.9175;
            const baseLng = lastKnownLng || 107.6191;
            const nextLat = baseLat + (Math.random() * 0.00045 - 0.00008);
            const nextLng = baseLng + (Math.random() * 0.00045 - 0.00008);
            updateMarkerPosition(nextLat, nextLng, 5, false);
            recordCoordinate(nextLat, nextLng, 5);
        }

        btnAction.addEventListener('click', () => {
            if (!isTracking) {
                // MULAI
                isTracking = true;
                totalDistance = 0;
                totalSeconds = 0;
                routeCoordinates = [];
                routePolyline.setLatLngs([]);
                distanceDisplay.innerText = "0.00";
                timerDisplay.innerText = "00:00:00";
                paceDisplay.innerText = "0'00\"";
                calDisplay.innerText = "0";

                if (startMarker) { map.removeLayer(startMarker); startMarker = null; }

                startTime = new Date();
                activityState.innerText = "RECORDING";
                activityState.className = "text-[10px] font-mono-num font-bold uppercase tracking-widest text-emerald-400";
                btnSim.classList.remove('hidden');

                if (lastKnownLat && lastKnownLng) {
                    recordCoordinate(lastKnownLat, lastKnownLng, 5);
                }

                btnAction.innerText = "SELESAI & SIMPAN";
                btnAction.className = "w-full bg-rose-600 hover:bg-rose-500 text-white font-extrabold uppercase tracking-wider py-3.5 rounded-lg transition-colors active:scale-[0.99] text-xs";

                timerInterval = setInterval(() => {
                    totalSeconds = Math.floor((new Date() - startTime) / 1000);
                    const h = String(Math.floor(totalSeconds / 3600)).padStart(2, '0');
                    const m = String(Math.floor((totalSeconds % 3600) / 60)).padStart(2, '0');
                    const s = String(totalSeconds % 60).padStart(2, '0');
                    timerDisplay.innerText = `${h}:${m}:${s}`;

                    const calByDist = Math.round(totalDistance * 65);
                    const calByTime = Math.round((totalSeconds / 60) * 4.5);
                    calDisplay.innerText = Math.max(calByDist, calByTime);

                    if (totalDistance > 0.005) {
                        const pSecs = totalSeconds / totalDistance;
                        const pMin = Math.floor(pSecs / 60);
                        const pSec = String(Math.floor(pSecs % 60)).padStart(2, '0');
                        paceDisplay.innerText = pMin < 99 ? `${pMin}'${pSec}"` : `0'00"`;
                    }
                }, 1000);

            } else {
                // SELESAI
                isTracking = false;
                clearInterval(timerInterval);

                const endTime = new Date();
                const finalCalories = parseInt(calDisplay.innerText, 10) || 0;
                const finalPace = paceDisplay.innerText;

                dbData = {
                    nama_user: userNameEl.innerText,
                    hari_ke: currentDayNumber,
                    lokasi: currentCity,
                    waktu_mulai: formatMySQLDate(startTime),
                    waktu_selesai: formatMySQLDate(endTime),
                    jarak_km: parseFloat(totalDistance.toFixed(2)),
                    durasi_detik: totalSeconds,
                    kalori: finalCalories,
                    pace: finalPace,
                    koordinat_rute: routeCoordinates
                };

                btnSim.classList.add('hidden');
                activityState.innerText = "COMPLETED";
                activityState.className = "text-[10px] font-mono-num font-bold uppercase tracking-widest text-sky-400";

                btnAction.innerText = "MULAI AKTIVITAS";
                btnAction.className = "w-full bg-white hover:bg-neutral-200 text-neutral-950 font-extrabold uppercase tracking-wider py-3.5 rounded-lg transition-colors active:scale-[0.99] text-xs";

                if (routeCoordinates.length > 1) {
                    map.fitBounds(routePolyline.getBounds(), { padding: [50, 50], animate: true });
                }

                document.fonts.ready.then(() => {
                    renderSharePoster(dbData, endTime);
                    document.getElementById('resultModal').classList.remove('hidden');
                });

                saveSessionToDB(dbData);
            }
        });

        // =====================================================
        // 4. GENERATOR POSTER 1080 x 1920 PIXEL (CLEAN EDITORIAL)
        // =====================================================
        function renderSharePoster(data, endTime) {
            const canvas = document.getElementById('shareCanvas');
            const ctx = canvas.getContext('2d');
            const W = 1080, H = 1920;

            // 1. Background Solid Deep Matte
            ctx.fillStyle = '#090a0f';
            ctx.fillRect(0, 0, W, H);

            // Grid Teknis Tipis
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
            ctx.lineWidth = 1;
            for (let x = 90; x < W; x += 90) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
            }
            for (let y = 90; y < H; y += 90) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
            }

            const padX = 90;

            // 2. Top Brand & Day Index
            ctx.fillStyle = '#38bdf8';
            ctx.font = '700 24px "JetBrains Mono", monospace';
            ctx.fillText('DAKREATIV STRIDE // TELEMETRY', padX, 130);

            ctx.fillStyle = '#ffffff';
            ctx.font = '800 28px "JetBrains Mono", monospace';
            ctx.textAlign = 'right';
            ctx.fillText(`DAY ${String(data.hari_ke).padStart(2, '0')}`, W - padX, 130);
            ctx.textAlign = 'left';

            // Garis Horizontal Atas
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(padX, 165); ctx.lineTo(W - padX, 165); ctx.stroke();

            // 3. Nama User, Lokasi & Waktu
            ctx.fillStyle = '#ffffff';
            ctx.font = '800 56px "Plus Jakarta Sans", sans-serif';
            ctx.fillText(data.nama_user.toUpperCase(), padX, 250);

            const tglStr = endTime.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' }).toUpperCase();
            const jamStr = endTime.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });

            ctx.fillStyle = '#9ca3af';
            ctx.font = '600 26px "JetBrains Mono", monospace';
            ctx.fillText(`${data.lokasi.toUpperCase()}  •  ${tglStr} / ${jamStr}`, padX, 305);

            // 4. Route Viewport Frame (Tengah)
            const boxX = padX, boxY = 360, boxW = W - (padX * 2), boxH = 760;
            ctx.fillStyle = '#0d1017';
            ctx.fillRect(boxX, boxY, boxW, boxH);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
            ctx.lineWidth = 2;
            ctx.strokeRect(boxX, boxY, boxW, boxH);

            // Corner Crosshairs
            const ch = 20;
            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 4;
            // Top-left
            ctx.beginPath(); ctx.moveTo(boxX, boxY + ch); ctx.lineTo(boxX, boxY); ctx.lineTo(boxX + ch, boxY); ctx.stroke();
            // Top-right
            ctx.beginPath(); ctx.moveTo(boxX + boxW - ch, boxY); ctx.lineTo(boxX + boxW, boxY); ctx.lineTo(boxX + boxW, boxY + ch); ctx.stroke();
            // Bottom-left
            ctx.beginPath(); ctx.moveTo(boxX, boxY + boxH - ch); ctx.lineTo(boxX, boxY + boxH); ctx.lineTo(boxX + ch, boxY + boxH); ctx.stroke();
            // Bottom-right
            ctx.beginPath(); ctx.moveTo(boxX + boxW - ch, boxY + boxH); ctx.lineTo(boxX + boxW, boxY + boxH); ctx.lineTo(boxX + boxW, boxY + boxH - ch); ctx.stroke();

            // Render Polyline Rute Proporsional (Tanpa Distorsi Aspek Rasio)
            const coords = data.koordinat_rute && data.koordinat_rute.length > 1
                ? data.koordinat_rute
                : [[-6.9175, 107.6191], [-6.9168, 107.6202], [-6.9155, 107.6198], [-6.9148, 107.6212]];

            const lats = coords.map(c => c[0]), lngs = coords.map(c => c[1]);
            const minLat = Math.min(...lats), maxLat = Math.max(...lats);
            const minLng = Math.min(...lngs), maxLng = Math.max(...lngs);
            const latSpan = (maxLat - minLat) || 0.0005;
            const lngSpan = (maxLng - minLng) || 0.0005;

            const innerPad = 110;
            const availW = boxW - innerPad * 2;
            const availH = boxH - innerPad * 2;
            const scale = Math.min(availW / lngSpan, availH / latSpan);

            const offsetX = boxX + (boxW - lngSpan * scale) / 2;
            const offsetY = boxY + (boxH - latSpan * scale) / 2;

            const mappedPts = coords.map(c => ({
                x: offsetX + (c[1] - minLng) * scale,
                y: boxY + boxH - (offsetY - boxY + (c[0] - minLat) * scale)
            }));

            ctx.save();
            ctx.beginPath();
            mappedPts.forEach((p, idx) => idx === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 10;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.stroke();
            ctx.restore();

            // Titik Start & End
            const firstPt = mappedPts[0], lastPt = mappedPts[mappedPts.length - 1];
            ctx.fillStyle = '#0d1017';
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 5;
            ctx.beginPath(); ctx.arc(firstPt.x, firstPt.y, 10, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

            ctx.fillStyle = '#38bdf8';
            ctx.beginPath(); ctx.arc(lastPt.x, lastPt.y, 12, 0, Math.PI * 2); ctx.fill();

            ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
            ctx.font = '600 20px "JetBrains Mono", monospace';
            ctx.fillText('GPS TRACE LOG', boxX + 35, boxY + boxH - 35);

            // 5. Angka Jarak Utama (Hero Metric)
            ctx.fillStyle = '#9ca3af';
            ctx.font = '700 24px "JetBrains Mono", monospace';
            ctx.fillText('DISTANCE', padX, 1210);

            const distText = data.jarak_km.toFixed(2);
            ctx.fillStyle = '#ffffff';
            ctx.font = '800 190px "JetBrains Mono", monospace';
            ctx.fillText(distText, padX, 1395);

            const distWidth = ctx.measureText(distText).width;
            ctx.fillStyle = '#38bdf8';
            ctx.font = '800 48px "JetBrains Mono", monospace';
            ctx.fillText('KM', padX + distWidth + 24, 1395);

            // 6. Baris Statistik 3 Kolom (Durasi, Pace, Kalori)
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(padX, 1465); ctx.lineTo(W - padX, 1465); ctx.stroke();

            const h = String(Math.floor(data.durasi_detik / 3600)).padStart(2, '0');
            const m = String(Math.floor((data.durasi_detik % 3600) / 60)).padStart(2, '0');
            const s = String(data.durasi_detik % 60).padStart(2, '0');
            const durasiFormatted = h !== '00' ? `${h}:${m}:${s}` : `${m}:${s}`;

            // Kolom 1: Duration
            ctx.fillStyle = '#9ca3af';
            ctx.font = '700 22px "JetBrains Mono", monospace';
            ctx.fillText('DURATION', padX, 1530);
            ctx.fillStyle = '#ffffff';
            ctx.font = '800 56px "JetBrains Mono", monospace';
            ctx.fillText(durasiFormatted, padX, 1605);

            // Kolom 2: Pace
            const col2X = 430;
            ctx.fillStyle = '#9ca3af';
            ctx.font = '700 22px "JetBrains Mono", monospace';
            ctx.fillText('AVG PACE', col2X, 1530);
            ctx.fillStyle = '#ffffff';
            ctx.font = '800 56px "JetBrains Mono", monospace';
            ctx.fillText(`${data.pace}/KM`, col2X, 1605);

            // Kolom 3: Calories
            const col3X = 760;
            ctx.fillStyle = '#9ca3af';
            ctx.font = '700 22px "JetBrains Mono", monospace';
            ctx.fillText('ENERGY', col3X, 1530);
            ctx.fillStyle = '#38bdf8';
            ctx.font = '800 56px "JetBrains Mono", monospace';
            ctx.fillText(`${data.kalori} KCAL`, col3X, 1605);

            ctx.beginPath(); ctx.moveTo(padX, 1665); ctx.lineTo(W - padX, 1665); ctx.stroke();

            // 7. Footer
            ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.font = '600 22px "JetBrains Mono", monospace';
            ctx.fillText('DAKREATIV DIGITAL MEDIA', padX, 1790);

            ctx.textAlign = 'right';
            ctx.fillStyle = '#ffffff';
            ctx.fillText('VERIFIED GPS ACTIVITY', W - padX, 1790);
            ctx.textAlign = 'left';
        }

        function downloadScreenshotCard() {
            const canvas = document.getElementById('shareCanvas');
            const link = document.createElement('a');
            link.download = `Stride-Day${currentDayNumber}-${Date.now()}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        function closeResultModal() {
            document.getElementById('resultModal').classList.add('hidden');
        }

        // =====================================================
        // 5. SIMPAN KE DATABASE & LOCALSTORAGE
        // =====================================================
        function saveSessionToDB(payload) {
            const localHistory = JSON.parse(localStorage.getItem('stride_history_list') || '[]');
            localHistory.unshift({ id: Date.now(), ...payload });
            localStorage.setItem('stride_history_list', JSON.stringify(localHistory));

            currentDayNumber += 1;
            localStorage.setItem('stride_day_count', currentDayNumber);
            dayBadgeEl.innerText = formatDayBadge(currentDayNumber);

            const dbSaveDot = document.getElementById('dbSaveDot');
            const dbSaveStatus = document.getElementById('dbSaveStatus');

            fetch('simpan_data.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(r => r.json())
            .then(res => {
                if (res.status === 'success') {
                    dbSaveDot.className = "w-2 h-2 rounded-full bg-emerald-400";
                    dbSaveStatus.innerText = `Tersimpan di Database (Day ${payload.hari_ke})`;
                } else {
                    dbSaveDot.className = "w-2 h-2 rounded-full bg-sky-400";
                    dbSaveStatus.innerText = "Tersimpan di Perangkat";
                }
            })
            .catch(() => {
                dbSaveDot.className = "w-2 h-2 rounded-full bg-sky-400";
                dbSaveStatus.innerText = "Tersimpan di Perangkat";
            });
        }
    </script>
</body>
</html>
